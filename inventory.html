<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מלאי ושאריות | SHALVERO FORGE</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head><body><div id="nav"></div><main class="wrap"><p class="tag">MATERIAL INVENTORY</p><h1>מלאי מוטות ושאריות</h1><p class="muted">שומרים חתיכות שימושיות במקום לזרוק אותן — והאופטימייזר ינסה להשתמש בהן לפני מוט חדש.</p><div class="card"><div class="formgrid"><label>פרופיל <span class="unit">חתך במ״מ</span><input id="profile" placeholder="40×40×2"></label><label>אורך (מ״מ)<input id="length" type="number" inputmode="numeric"></label><label>סוג מלאי<select id="itemType"><option value="remnant">שארית</option><option value="full">מוט מלא</option></select></label><label>מקור / הערה<input id="note" placeholder="למשל שארית מפרויקט שער"></label></div><div class="actions"><button class="btn" id="add">הוסף למלאי</button><a class="btn ghost" href="optimizer.html">פתח אופטימייזר</a></div><div id="msg"></div></div><div class="formgrid" style="margin:16px 0"><label>סינון לפי פרופיל<input id="filter" placeholder="חיפוש"></label><label>מינימום אורך <span class="unit">מ״מ</span><input id="min" type="number" value="0"></label></div><div id="summary" class="grid"></div><div id="list" style="margin-top:14px"></div></main><script src="app.js"></script><script>nav.innerHTML=MP.nav('inventory.html');function render(){const I=MP.inventory(),f=filter.value.trim().toLowerCase(),mn=+min.value||0,V=I.filter(x=>(!f||(x.profile||'').toLowerCase().includes(f))&&+x.length>=mn).sort((a,b)=>b.length-a.length);const total=I.reduce((a,x)=>a+(+x.length||0),0);summary.innerHTML=`<div class="card"><div class="muted">חתיכות במלאי</div><div class="stat">${I.length}</div></div><div class="card"><div class="muted">אורך כולל</div><div class="stat">${(total/1000).toFixed(1)} מ׳</div></div>`;list.innerHTML=V.length?`<div class="tbl"><table><thead><tr><th>פרופיל <span class="thunit">חתך במ״מ</span></th><th>אורך <span class="thunit">מ״מ</span></th><th>סוג</th><th>מקור</th><th>תאריך</th><th></th></tr></thead><tbody>${V.map(x=>`<tr><td>${MP.esc(x.profile||'—')}</td><td><b>${Math.round(+x.length)} מ״מ</b></td><td>${x.type==='full'?'מוט מלא':'שארית'}</td><td>${MP.esc(x.source||x.note||'')}</td><td>${MP.esc(x.date||'')}</td><td><button class="btn ghost small" data-id="${MP.esc(x.id)}">הסר</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין שאריות מתאימות בסינון הנוכחי.</div>'}add.onclick=()=>{const lengthEl=document.getElementById("length"),l=+lengthEl.value;if(!(l>0)||!profile.value.trim()){msg.innerHTML='<div class="notice bad">יש להזין פרופיל ואורך תקינים.</div>';return}const I=MP.inventory();I.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),profile:profile.value.trim(),length:Math.round(l),type:document.getElementById('itemType').value,source:note.value.trim()||'הזנה ידנית',date:new Date().toISOString().slice(0,10)});MP.saveInventory(I);lengthEl.value='';note.value='';msg.innerHTML='<div class="notice ok">נוסף למלאי ✓</div>';render()};list.onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;MP.saveInventory(MP.inventory().filter(x=>x.id!==b.dataset.id));render()};filter.oninput=render;min.oninput=render;render()</script></body></html>
