<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרויקטים ולקוחות | SHALVERO FORGE</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head>
<body><div id="nav"></div><main class="wrap"><p class="tag">WORKSHOP CRM</p><h1>פרויקטים ולקוחות</h1><p class="muted">מנהל עבודה יומי: סטטוס, יעד, גבייה ופעולה הבאה — בלי לחפש בין מסכים.</p>
<div class="actions"><a class="btn" href="new-job.html">+ עבודה חדשה</a><a class="btn ghost" href="production.html">לוח ייצור</a><button class="btn ghost" id="exp" type="button">הורדת גיבוי פרויקטים</button><label class="btn ghost" style="cursor:pointer">ייבוא<input id="imp" type="file" accept="application/json,.json" hidden></label></div><div id="backupMsg"></div>
<div class="grid" id="sum"></div><div id="deadlineAlert"></div>
<div class="project-toolbar"><label>סינון סטטוס<select id="flt"></select></label><label>תזמון<select id="timeF"><option value="">הכול</option><option value="late">באיחור</option><option value="week">7 הימים הקרובים</option><option value="nodue">ללא יעד</option></select></label><label>חיפוש לקוח / טלפון / עבודה<input id="q" autocomplete="off" placeholder="שם, טלפון או סוג עבודה"></label></div>
<div id="list"></div></main><script src="app.js"></script><script>
nav.innerHTML=MP.nav('projects.html');
const ST=['ליד','מדידה','הצעת מחיר','אושר','חומרים הוזמנו','חיתוך','ריתוך','צבע/גלוון','מוכן להתקנה','הותקן','שולם'];
const COLORS=['#868E96','#495057','#1C7ED6','#1864AB','#E8590C','#F08C00','#D9480F','#AE3EC9','#F59F00','#2F9E44','#2B8A3E'];
const done=new Set(['הותקן','שולם']),today=()=>new Date().toISOString().slice(0,10),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
let L=MP.projects().map(norm);MP.saveProjects(L);
function norm(p){return Object.assign({uid:uid(),id:'',name:'עבודה',size:'',cust:'',phone:'',status:'הצעת מחיר',date:today(),price:'',dep:'',due:'',notes:'',material:'',updatedAt:new Date().toISOString()},p||{}, {uid:p?.uid||uid()})}
flt.innerHTML='<option value="">הכול</option>'+ST.map(s=>`<option>${s}</option>`).join('');
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}
function fmtDue(d){if(!d)return'ללא תאריך יעד';const n=daysUntil(d);if(n<0)return`באיחור ${Math.abs(n)} ימים`;if(n===0)return'היום';if(n===1)return'מחר';if(n<=7)return`בעוד ${n} ימים`;return new Date(d+'T12:00:00').toLocaleDateString('he-IL')}
function save(){MP.saveProjects(L)}
function update(uidv,k,v){const p=L.find(x=>x.uid===uidv);if(!p)return;p[k]=v;p.updatedAt=new Date().toISOString();save();render()}
function move(uidv,dir){const p=L.find(x=>x.uid===uidv);if(!p)return;const i=Math.max(0,ST.indexOf(p.status)),ni=Math.max(0,Math.min(ST.length-1,i+dir));if(ni!==i){p.status=ST[ni];p.updatedAt=new Date().toISOString();save();render()}}
function render(){const now=today(),f=flt.value,tf=timeF.value,qq=q.value.trim().toLowerCase();const open=L.filter(p=>!done.has(p.status)),tot=L.reduce((a,p)=>a+(+p.price||0),0),paid=L.reduce((a,p)=>a+(+p.dep||0),0),late=open.filter(p=>p.due&&p.due<now),week=open.filter(p=>{const n=daysUntil(p.due);return n!==null&&n>=0&&n<=7});
 sum.innerHTML=[['פרויקטים',L.length],['פתוחים',open.length],['באיחור',late.length],['יעד השבוע',week.length],['סה״כ הצעות',MP.money(tot)],['יתרה לגבייה',MP.money(Math.max(0,tot-paid))]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('');
 deadlineAlert.innerHTML=late.length?`<div class="notice bad"><b>${late.length} עבודות באיחור.</b> ${late.slice(0,3).map(p=>MP.esc(p.cust||p.name)).join(' · ')}</div>`:week.length?`<div class="notice"><b>${week.length} עבודות עם יעד בשבעת הימים הקרובים.</b></div>`:'';
 const vis=L.filter(p=>{const text=`${p.cust} ${p.phone} ${p.name} ${p.size}`.toLowerCase();if(f&&p.status!==f)return false;if(qq&&!text.includes(qq))return false;const n=daysUntil(p.due);if(tf==='late'&&!(n!==null&&n<0))return false;if(tf==='week'&&!(n!==null&&n>=0&&n<=7))return false;if(tf==='nodue'&&p.due)return false;return true}).sort((a,b)=>{const an=daysUntil(a.due),bn=daysUntil(b.due),aa=an!==null&&an<0?0:1,bb=bn!==null&&bn<0?0:1;return aa-bb||String(a.due||'9999').localeCompare(String(b.due||'9999'))||String(b.updatedAt).localeCompare(String(a.updatedAt))});
 list.innerHTML=vis.length?vis.map(projectCard).join(''):'<div class="empty">אין פרויקטים שמתאימים לסינון.</div>';
}
function projectCard(p){const si=Math.max(0,ST.indexOf(p.status)),ph=String(p.phone||'').replace(/[^0-9]/g,''),n=daysUntil(p.due),late=n!==null&&n<0,soon=n!==null&&n>=0&&n<=7,plan=p.id?`plans.html?project=${encodeURIComponent(p.uid)}#${encodeURIComponent(p.id)}`:'',next=si<ST.length-1?ST[si+1]:'',prev=si>0?ST[si-1]:'';const newClient=`new-job.html?cust=${encodeURIComponent(p.cust||'')}&phone=${encodeURIComponent(p.phone||'')}`;
 return `<article class="project-card${late?' is-late':soon?' is-soon':''}" data-uid="${MP.esc(p.uid)}"><div class="project-card-head"><div><div class="project-title"><b>${MP.esc(p.cust||'לקוח ללא שם')}</b><span>·</span><span>${MP.esc(p.name)}</span></div><div class="muted">${MP.esc(p.size)} · נפתח ${MP.esc(p.date||'')}${(+p.workMinutes||0)?' · זמן '+Math.floor((+p.workMinutes||0)/60)+':'+String((+p.workMinutes||0)%60).padStart(2,'0')+' ש׳':''}</div></div><div class="project-head-meta"><span class="pill" style="background:${COLORS[si]};color:white;border:0">${MP.esc(p.status)}</span><span class="due-chip${late?' late':soon?' soon':''}">${fmtDue(p.due)}</span></div></div>
 <div class="stage-track" aria-label="שלב ${si+1} מתוך ${ST.length}"><i style="width:${Math.round((si/(ST.length-1))*100)}%"></i></div>
 <div class="quick-stage"><button class="btn ghost small" data-back="${MP.esc(p.uid)}" ${prev?'':'disabled'}>← ${prev?MP.esc(prev):'התחלה'}</button>${next?`<button class="btn small" data-next="${MP.esc(p.uid)}">המשך: ${MP.esc(next)} →</button>`:'<span class="pill">העבודה הושלמה</span>'}</div>
 <details class="project-details"><summary>פרטים ועריכה</summary><div class="formgrid"><label>לקוח<input data-u="${MP.esc(p.uid)}" data-k="cust" value="${MP.esc(p.cust)}"></label><label>טלפון<input data-u="${MP.esc(p.uid)}" data-k="phone" value="${MP.esc(p.phone)}"></label><label>סטטוס<select data-u="${MP.esc(p.uid)}" data-k="status">${ST.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label><label>מחיר כולל (₪)<input type="number" data-u="${MP.esc(p.uid)}" data-k="price" value="${MP.esc(p.price)}"></label><label>שולם / מקדמה (₪)<input type="number" data-u="${MP.esc(p.uid)}" data-k="dep" value="${MP.esc(p.dep)}"></label><label>תאריך יעד<input type="date" data-u="${MP.esc(p.uid)}" data-k="due" value="${MP.esc(p.due)}"></label></div><label>הערות<input data-u="${MP.esc(p.uid)}" data-k="notes" value="${MP.esc(p.notes)}"></label></details>
 <div class="project-actions">${plan?`<a class="btn ghost small" href="${plan}">פתח תוכנית</a>`:''}<a class="btn ghost small" href="quotes.html?project=${encodeURIComponent(p.uid)}">הצעת מחיר</a><a class="btn ghost small" href="finance.html?project=${encodeURIComponent(p.uid)}">רווחיות</a><a class="btn ghost small" href="${newClient}">עבודה נוספת ללקוח</a>${ph?`<a class="btn ghost small" target="_blank" rel="noopener" href="https://wa.me/${ph.startsWith('0')?'972'+ph.slice(1):ph}">WhatsApp</a>`:''}<button class="btn ghost small danger" data-del="${MP.esc(p.uid)}" type="button">מחיקה</button></div></article>`}
list.addEventListener('change',e=>{const t=e.target;if(t.dataset.u&&t.dataset.k)update(t.dataset.u,t.dataset.k,t.value)});
list.addEventListener('click',e=>{const n=e.target.closest('[data-next]'),b=e.target.closest('[data-back]'),d=e.target.closest('[data-del]');if(n)move(n.dataset.next,1);if(b)move(b.dataset.back,-1);if(d&&confirm('למחוק את הפרויקט?')){L=L.filter(x=>x.uid!==d.dataset.del);save();render()}});
flt.onchange=render;timeF.onchange=render;q.oninput=render;
exp.onclick=()=>{const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),projects:L},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shalvero-forge-projects-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
imp.onchange=async()=>{const f=imp.files[0];if(!f)return;try{const raw=JSON.parse(await f.text()),arr=Array.isArray(raw)?raw:raw.projects;if(!Array.isArray(arr))throw Error();const seen=new Set(L.map(p=>p.uid||[p.id,p.cust,p.date,p.name].join('|'))),add=arr.map(norm).filter(p=>{const k=p.uid||[p.id,p.cust,p.date,p.name].join('|');if(seen.has(k))return false;seen.add(k);return true});L=[...add,...L];save();backupMsg.innerHTML=`<div class="notice ok">יובאו ${add.length} פרויקטים חדשים ✓</div>`;render()}catch{backupMsg.innerHTML='<div class="notice bad">קובץ הייבוא אינו תקין.</div>'}imp.value=''};render();
</script></body></html>
