<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פרויקטים ולקוחות | SHALVERO FORGE</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head><body><div id="nav"></div><main class="wrap"><p class="tag">WORKSHOP CRM</p><h1>פרויקטים ולקוחות</h1><p class="muted">מהליד הראשון ועד “שולם” — עם מחיר, מקדמה, תאריך יעד ופרטי לקוח.</p><div class="actions"><a class="btn" href="new-job.html">+ עבודה חדשה</a><button class="btn ghost" id="exp">הורדת גיבוי פרויקטים</button><label class="btn ghost" style="cursor:pointer">ייבוא<input id="imp" type="file" accept="application/json,.json" hidden></label></div><div id="backupMsg"></div><div class="grid" id="sum"></div><div class="formgrid" style="margin:16px 0"><label>סינון סטטוס<select id="flt"></select></label><label>חיפוש לקוח / טלפון<input id="q" autocomplete="off"></label></div><div id="list"></div></main><script src="app.js"></script><script>nav.innerHTML=MP.nav('projects.html');const ST=['ליד','מדידה','הצעת מחיר','אושר','חומרים הוזמנו','חיתוך','ריתוך','צבע/גלוון','מוכן להתקנה','הותקן','שולם'];const COLORS=['#868E96','#495057','#1C7ED6','#1864AB','#E8590C','#F08C00','#D9480F','#AE3EC9','#F59F00','#2F9E44','#2B8A3E'];let L=MP.projects();function norm(p){return Object.assign({id:'',name:'עבודה',size:'',cust:'',phone:'',status:'הצעת מחיר',date:new Date().toISOString().slice(0,10),price:'',dep:'',due:'',notes:'',material:''},p||{})}L=L.map(norm);MP.saveProjects(L);flt.innerHTML='<option value="">הכול</option>'+ST.map(s=>`<option>${s}</option>`).join('');function render(){const f=flt.value,qq=q.value.trim().toLowerCase(),vis=L.map((p,i)=>[p,i]).filter(([p])=>(!f||p.status===f)&&(!qq||`${p.cust} ${p.phone}`.toLowerCase().includes(qq))),open=L.filter(p=>!['הותקן','שולם'].includes(p.status)),tot=L.reduce((a,p)=>a+(+p.price||0),0),dep=L.reduce((a,p)=>a+(+p.dep||0),0),over=L.filter(p=>p.due&&!['הותקן','שולם'].includes(p.status)&&p.due<new Date().toISOString().slice(0,10)).length;sum.innerHTML=[['פרויקטים',L.length],['פתוחים',open.length],['סה״כ הצעות',MP.money(tot)],['יתרה לגבייה',MP.money(Math.max(0,tot-dep))],['באיחור',over]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat">${x[1]}</div></div>`).join('');list.innerHTML=vis.length?vis.map(([p,i])=>{const si=Math.max(0,ST.indexOf(p.status)),ph=String(p.phone||'').replace(/[^0-9]/g,'');return`<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${MP.esc(p.cust||'לקוח ללא שם')}</b> · ${MP.esc(p.name)}<div class="muted">${MP.esc(p.size)} · ${MP.esc(p.date||'')}</div></div><span class="pill" style="background:${COLORS[si]||COLORS[2]};color:white;border:0">${MP.esc(p.status)}</span></div><div class="formgrid" style="margin-top:10px"><label>לקוח<input data-i="${i}" data-k="cust" value="${MP.esc(p.cust)}"></label><label>טלפון<input data-i="${i}" data-k="phone" value="${MP.esc(p.phone)}"></label><label>סטטוס<select data-i="${i}" data-k="status">${ST.map(s=>`<option ${s===p.status?'selected':''}>${s}</option>`).join('')}</select></label><label>מחיר כולל (₪)<input type="number" data-i="${i}" data-k="price" value="${MP.esc(p.price)}"></label><label>מקדמה (₪)<input type="number" data-i="${i}" data-k="dep" value="${MP.esc(p.dep)}"></label><label>תאריך יעד<input type="date" data-i="${i}" data-k="due" value="${MP.esc(p.due)}"></label></div><label style="margin-top:8px">הערות<input data-i="${i}" data-k="notes" value="${MP.esc(p.notes)}"></label><div class="actions">${p.id?`<a class="btn ghost small" href="plans.html#${encodeURIComponent(p.id)}">לתוכנית</a>`:''}${ph?`<a class="btn ghost small" target="_blank" rel="noopener" href="https://wa.me/${ph.startsWith('0')?'972'+ph.slice(1):ph}">WhatsApp</a>`:''}<button class="btn ghost small danger" data-del="${i}" type="button">מחיקה</button></div></div>`}).join(''):'<div class="empty">אין עדיין פרויקטים.<br><br><a class="btn" href="new-job.html">פתח עבודה חדשה</a></div>'}list.addEventListener('change',e=>{const t=e.target;if(t.dataset.k&&L[+t.dataset.i]){L[+t.dataset.i][t.dataset.k]=t.value;MP.saveProjects(L);render()}});list.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b&&confirm('למחוק את הפרויקט?')){L.splice(+b.dataset.del,1);MP.saveProjects(L);render()}});flt.onchange=render;q.oninput=render;exp.onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),projects:L},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='metal-plans-projects-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};imp.onchange=async()=>{const f=imp.files[0];if(!f)return;try{const raw=JSON.parse(await f.text()),arr=Array.isArray(raw)?raw:raw.projects;if(!Array.isArray(arr))throw Error();const seen=new Set(L.map(p=>[p.id,p.cust,p.date,p.name].join('|'))),add=arr.map(norm).filter(p=>{const k=[p.id,p.cust,p.date,p.name].join('|');if(seen.has(k))return false;seen.add(k);return true});L=[...add,...L];MP.saveProjects(L);backupMsg.innerHTML=`<div class="notice ok">יובאו ${add.length} פרויקטים חדשים ✓</div>`;render()}catch{backupMsg.innerHTML='<div class="notice bad">קובץ הייבוא אינו תקין.</div>'}imp.value=''};render()</script></body></html>
