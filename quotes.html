<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הצעת מחיר | SHALVERO FORGE</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="operations.css"></head>
<body><div id="nav" class="screen-only"></div><main class="wrap"><div class="screen-only"><p class="tag">QUOTE DOCUMENT</p><h1>הצעת מחיר מקצועית</h1><p class="muted">המסמך נוצר מהנתונים השמורים בפרויקט. יש לבדוק את כל הפרטים לפני מסירה ללקוח.</p>
<div class="card"><div class="formgrid"><label>פרויקט<select id="project"></select></label><label>מספר הצעה<input id="quoteNo" maxlength="50"></label><label>תאריך תוקף<input id="quoteValid" type="date"></label><label>מע״מ<select id="quoteVat"><option value="unset">טרם הוגדר</option><option value="included">המחיר כולל מע״מ</option><option value="excluded">מע״מ יתווסף למחיר</option></select></label><label>תיאור עבודה<textarea id="quoteDescription" rows="3"></textarea></label><label>תנאי תשלום ואחריות<textarea id="quoteTerms" rows="3" placeholder="מקדמה, יתרה, זמן אספקה, אחריות והחרגות"></textarea></label></div><div class="actions"><button class="btn" id="saveQuote" type="button">שמור פרטי הצעה</button><button class="btn ghost" id="printQuote" type="button">הדפס / שמור כ־PDF</button><a href="projects.html" class="btn ghost">לפרויקטים</a></div><div id="quoteMsg" role="status" aria-live="polite"></div></div></div>
<article id="quoteSheet" class="card quote-sheet"></article><div class="notice screen-only">הצעת המחיר אינה חשבונית מס או אישור הנדסי. אין כאן חתימה דיגיטלית או שליחה אוטומטית ללקוח.</div>
</main><script src="app.js"></script><script>
const $=id=>document.getElementById(id);$('nav').innerHTML=MP.nav('quotes.html');
const today=new Date().toISOString().slice(0,10),S=MP.settings();let P=MP.projects();
let current=new URLSearchParams(location.search).get('project')||P[0]?.uid||'';
function money(n){return MP.money(n)}
function saved(){return P.find(p=>p.uid===current)}
function renderChooser(){$('project').innerHTML=P.map(p=>'<option value="'+MP.esc(p.uid)+'">'+MP.esc((p.cust||'ללא לקוח')+' · '+(p.name||''))+'</option>').join('');$('project').value=current}
function fields(){const p=saved();if(!p){$('quoteSheet').innerHTML='<p>לא נמצא פרויקט. <a href="new-job.html">פתח עבודה חדשה</a></p>';return}
 $('quoteNo').value=p.quoteNo||('FORGE-Q-'+(p.date||today).replace(/\D/g,'')+'-'+String(p.uid).slice(0,6).toUpperCase());
 $('quoteValid').value=p.quoteValid||'';$('quoteVat').value=p.quoteVat||'unset';
 $('quoteDescription').value=p.quoteDescription||[p.name,p.size,p.material?'חומר: '+p.material:''].filter(Boolean).join(' · ');
 $('quoteTerms').value=p.quoteTerms||'';preview()}
function preview(){const p=saved();if(!p)return;const incl=$('quoteVat').value,vat=Number(S.vat)||0,amount=Number(p.price)||0;const total=incl==='excluded'?amount*(1+vat/100):amount;const vatText=incl==='included'?'הסכום כולל מע״מ':incl==='excluded'?'מע״מ בשיעור '+vat+'% יתווסף למחיר':'מצב המע״מ טרם הוגדר';
 $('quoteSheet').innerHTML='<div class="quote-brand"><div><strong>SHALVERO <em>FORGE</em></strong><p>הצעת מחיר · '+MP.esc($('quoteNo').value)+'</p></div><div><h2>'+MP.esc(S.biz||'שם העסק לא הוגדר')+'</h2><p>'+MP.esc(S.phone||'יש להוסיף טלפון בהגדרות העסק')+'</p></div></div><div class="quote-meta"><div><small>לכבוד</small><b>'+MP.esc(p.cust||'שם לקוח חסר')+'</b><span>'+MP.esc(p.phone||'')+'</span></div><div><small>תאריך</small><b>'+today+'</b><small>בתוקף עד</small><b>'+MP.esc($('quoteValid').value||'לא הוגדר')+'</b></div></div><h3>תיאור העבודה</h3><p class="quote-desc">'+MP.esc($('quoteDescription').value||'לא הוזן תיאור')+'</p><div class="quote-price"><span>מחיר הצעה</span><b>'+money(amount)+'</b></div><p>'+MP.esc(vatText)+(incl==='excluded'?' · מחיר כולל מע״מ: '+money(total):'')+'</p><h3>תנאים והערות</h3><p class="quote-desc">'+MP.esc($('quoteTerms').value||'לא הוגדרו תנאים')+'</p><div class="quote-foot"><div>שם וחתימת הלקוח: ____________________</div><div>תאריך: ____________</div></div><p class="muted" style="font-size:12px">מסמך זה הוא הצעת מחיר בלבד. ביצוע כפוף לאישור התוכנית, בדיקות מקצועיות ותנאי העסקה.</p>'}
function save(){const p=saved();if(!p)return;p.quoteNo=$('quoteNo').value.trim();p.quoteValid=$('quoteValid').value;p.quoteVat=$('quoteVat').value;p.quoteDescription=$('quoteDescription').value.trim();p.quoteTerms=$('quoteTerms').value.trim();p.updatedAt=new Date().toISOString();MP.saveProjects(P);$('quoteMsg').innerHTML='<div class="notice ok">פרטי ההצעה נשמרו בפרויקט ✓</div>'}
$('project').onchange=()=>{current=$('project').value;fields()};['quoteNo','quoteValid','quoteVat','quoteDescription','quoteTerms'].forEach(id=>$(id).addEventListener('input',preview));
$('saveQuote').onclick=save;$('printQuote').onclick=()=>{if(!(Number(saved()?.price)>0)){$('quoteMsg').innerHTML='<div class="notice bad">אין מחיר חיובי להצעת המחיר — יש לעדכן מחיר בפרויקט לפני הדפסה.</div>';return}if($('quoteVat').value==='unset'){if(!confirm('לא הוגדר אם המחיר כולל מע״מ. להמשיך להדפסה?'))return}save();print()};renderChooser();fields();
</script></body></html>
