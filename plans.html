<style>
:root{--bg:#F3F4F6;--bg2:#FFFFFF;--line:#D6DAE0;--or:#E8590C;--ort:#B93E07;--steel:#5B6670;--tx:#15181C}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select{font-family:inherit}
html,body{overflow-x:hidden}
body{font-family:Heebo,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:20px 0;border-bottom:1px solid var(--line)}
header a{color:var(--tx);text-decoration:none;font-weight:900}
h1{font-size:clamp(30px,6vw,52px);font-weight:900;line-height:1.1;margin:28px 0 8px}
h2{font-size:clamp(22px,4vw,32px);font-weight:900;margin:24px 0 12px}
.hl{background:var(--or);color:#fff;padding:0 .15em}
.muted{color:var(--steel)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.filters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));margin:20px 0}
.filters label{display:block;font-weight:700;margin-bottom:4px;font-size:15px}
select{width:100%;padding:12px;font-size:17px;background:var(--bg);color:var(--tx);border:1px solid var(--steel);border-radius:8px}
.types{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.types button{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;font-weight:700}
.types button.on{background:var(--or);color:#fff;border-color:var(--or)}
.types button.on .muted{color:#fff}
#detail:not(:empty){position:fixed;inset:0;z-index:20;background:rgba(20,24,28,.55);overflow-y:auto;padding:12px}
#detail .card{max-width:920px;margin:0 auto 40px}
.close{position:sticky;top:0;float:left;background:var(--bg);color:var(--tx);border:1px solid var(--steel);border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer;z-index:2}
@media(max-width:520px){main .list{grid-template-columns:1fr 1fr}.item{padding:8px;font-size:13px}.item b{font-size:14px}.item svg{height:64px}}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr))}
.item{display:block;text-align:right;background:var(--bg2);box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--tx);cursor:pointer;font-size:15px}
.item:hover,.item.sel{border-color:var(--or)}
.item b{display:block;font-size:16px}
.item svg{width:100%;height:90px;display:block;margin-bottom:6px}
.code{font-family:ui-monospace,Consolas,monospace;color:var(--ort);font-size:13px}
#detail svg{width:100%;height:auto;max-height:520px;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
table{width:100%;border-collapse:collapse;background:var(--bg2);margin-top:8px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
th{background:#EEF1F4;color:var(--ort)}
.tbl{overflow-x:auto}
.btn{display:inline-block;background:var(--or);color:#fff;font-weight:900;font-size:17px;padding:12px 22px;border-radius:8px;border:0;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--steel)}
.warn{border-right:4px solid var(--or);padding:12px 14px;background:#FFF4EC;border-radius:8px;margin:16px 0;font-size:14px}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
.meta>span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.count{font-size:15px;margin:10px 0}
.more{margin:16px auto;display:block}
footer{padding:40px 0;color:var(--steel);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
[dir=ltr]{unicode-bidi:isolate}
@media print{
 #detail:not(:empty){position:static;background:none;padding:0;overflow:visible}.close{display:none}
 body{background:#fff;color:#000}header,.filters,.types,.list,.more,.no-print,footer,.count,#intro{display:none!important}
 #detail svg{background:#fff;max-height:none}.card{border:1px solid #999;background:#fff}
 th{background:#eee;color:#000}td,th{border-color:#bbb}.warn{background:#f5f5f5;color:#000}.muted{color:#444}
}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.vw{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.vw figcaption{font-weight:900;font-size:15px;color:var(--ort);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.vw svg{width:100%;height:auto;max-height:420px;display:block}
#detail .vw svg{background:none;border:0;padding:0;max-height:420px}
.tb{margin:4px 0 8px;font-size:13px}.tb td{border:1px solid var(--tx);padding:6px 8px}
.bn{display:inline-block;min-width:24px;height:24px;border:1.5px solid var(--ort);color:var(--ort);border-radius:50%;text-align:center;line-height:21px;font-size:13px}
.item svg{width:100%;height:110px;display:block;margin-bottom:6px}
@media(max-width:700px){.views{grid-template-columns:1fr}}
@media print{.views{grid-template-columns:1fr 1fr}.vw{break-inside:avoid}}
.types{display:block}.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.gt{font-weight:900;font-size:14px;color:var(--ort);flex-basis:100%;margin-top:4px}
.types{display:block}.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.gt{font-weight:900;font-size:14px;color:var(--ort);flex-basis:100%;margin-top:4px}
.tools{border-top:2px solid var(--line);margin-top:20px}.trow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.trow label,.qgrid label{display:flex;flex-direction:column;font-weight:700;font-size:14px;gap:4px}
.tools input,.tools select{padding:10px;font-size:16px;border:1px solid var(--steel);border-radius:8px;background:#fff;color:var(--tx);min-width:140px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}.qsum table{margin-top:12px}.soon2{font-size:13px;background:var(--or);color:#fff;border-radius:6px;padding:2px 8px;vertical-align:middle}
.cutp{margin:10px 0;font-size:15px}.cutp svg{display:block;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;font-weight:700;font-size:14px}.cbar button[data-c]{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.cbar button.on{outline:3px solid var(--or);outline-offset:2px}
.okb{border-right:4px solid #2F9E44;padding:10px 12px;background:#EBFBEE;border-radius:8px;font-size:15px}
</style>

<body>
<div id="nav"></div>
<main class="wrap">
 <div id="intro">
  <h1>ספריית <span class="hl">התוכניות</span></h1>
  <p class="muted" id="total"></p>
  <button class="type-picker-btn" id="typeToggle" type="button" aria-expanded="false"><span>בחרו סוג עבודה</span><strong id="currentType">שער נגרר</strong></button>
  <div class="types" id="types"></div>
  <div class="filters">
   <div><label for="fw" id="lw">רוחב</label><select id="fw"></select></div>
   <div><label for="fh" id="lh">גובה</label><select id="fh"></select></div>
   <div id="sw"><label for="fs">סגנון</label><select id="fs"></select></div>
  </div>
  <p class="count" id="count"></p>
 </div>
 <div class="list" id="list"></div>
 <button class="btn ghost more" id="more">הצג עוד</button>
 <section id="detail"></section>
</main>
<footer><div class="wrap">התוכניות הן תבניות עבודה לעבודות מסגרות נפוצות ואינן מחליפות תכנון הנדסי. יש לוודא התאמה לתקנים הרלוונטיים (למשל ת״י 1142 למעקות, ת״י 900-21.03 לשערים חשמליים) ולתנאי האתר.</div></footer>
<script src="app.js"></script><script src="welding.js"></script><script src="welding-v2.js"></script>
<script>
nav.innerHTML=MP.nav('plans.html');
// ===== 3D engine: model -> cut list + 4 projected views =====
const OR='#E8590C',OT='#B93E07',INK='#1F2328',ST='#6B7680',STOCK=6000,KERF=3;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const ltr=t=>`<span dir="ltr">${t}</span>`;
const sec=p=>{const v=p.split('×').map(Number);return[v[0],v[1]]};
let M=[],HW=[];
// element = two caps (3D point arrays) extruded between them
function elem(A,B,role,n,p,len){M.push({A,B,role,n,p,len})}
function box(x,y,z,dx,dy,dz,role='m',n,p,len){const r=(zz)=>[[x,y,zz],[x+dx,y,zz],[x+dx,y+dy,zz],[x,y+dy,zz]];elem(r(z),r(z+dz),role,n,p,len)}
// members: along x / y / z. section [a,b]: a = visible face, b = depth. rot swaps.
function bx(n,p,x,y,z,len,role='m',rot){let[a,b]=sec(p);if(rot)[a,b]=[b,a];box(x,y,z,len,a,b,role,n,p,len)}
function by(n,p,x,y,z,len,role='m',rot){let[a,b]=sec(p);if(rot)[a,b]=[b,a];box(x,y,z,a,len,b,role,n,p,len)}
function bz(n,p,x,y,z,len,role='m',rot){let[a,b]=sec(p);if(rot)[a,b]=[b,a];box(x,y,z,b,a,len,role,n,p,len)}
// slanted member in XY plane (extruded along z)
function sxy(n,p,x0,y0,x1,y1,z,role='m',rot){let[a,b]=sec(p);if(rot)[a,b]=[b,a];const L=Math.hypot(x1-x0,y1-y0),nx=-(y1-y0)/L*a,ny=(x1-x0)/L*a;
 const q=zz=>[[x0,y0,zz],[x1,y1,zz],[x1+nx,y1+ny,zz],[x0+nx,y0+ny,zz]];elem(q(z),q(z+b),role,n,p,Math.round(L));M[M.length-1].ang=Math.round(Math.abs(Math.atan2(y1-y0,x1-x0))*180/Math.PI)}
// slanted member in ZY plane (extruded along x)
function szy(n,p,z0,y0,z1,y1,x,role='m',rot){let[a,b]=sec(p);if(rot)[a,b]=[b,a];const L=Math.hypot(z1-z0,y1-y0),nz=-(y1-y0)/L*a,ny=(z1-z0)/L*a;
 const q=xx=>[[xx,y0,z0],[xx,y1,z1],[xx,y1+ny,z1+nz],[xx,y0+ny,z0+nz]];elem(q(x),q(x+b),role,n,p,Math.round(L));M[M.length-1].ang=Math.round(Math.abs(Math.atan2(y1-y0,z1-z0))*180/Math.PI)}
function frame(nr,ns,p,x,y,z,w,h){const[a]=sec(p);bx(nr,p,x,y,z,w);bx(nr,p,x,y+h-a,z,w);by(ns,p,x,y+a,z,h-2*a);by(ns,p,x+w-a,y+a,z,h-2*a);return a}
const SN={v:'מוטות אנכיים',h:'פרופילים אופקיים (פרטיות)',s:'פח מלא',m:'רשת מרותכת',q:'משבצות',l:'תריסים',d1:'חיפוי צד אחד',d2:'חיפוי שני צדדים'};
function infill(s,x,y,z,w,h,df,o={}){
 const bp=o.bp||'20×20×1.5',bw=sec(bp)[0],gap=o.gap||100,nm=o.nm||'מוט מילוי';
 if(s==='v'||s==='q'){const n=Math.max(0,Math.ceil((w-gap)/(gap+bw))),sp=(w-n*bw)/(n+1),zc=z+(df-sec(bp)[1])/2;
  for(let i=0;i<n;i++)by(nm,bp,x+sp+i*(bw+sp),y,zc,h);
  if(s==='q'){const k=Math.max(0,Math.ceil((h-gap)/(gap+bw))),sv=(h-k*bw)/(k+1);for(let i=0;i<k;i++)bx(o.nh||'מוט אופקי',bp,x,y+sv+i*(bw+sv),zc-sec(bp)[1],w)}
  return`מרווח בין מוטות: ${fmt(sp)} מ״מ`}
 if(s==='h'){const n=Math.max(1,Math.ceil((h-20)/80)),g=(h-n*60)/(n+1),zc=z+(df-20)/2;
  for(let i=0;i<n;i++)bx('פרופיל מילוי אופקי','60×20×1.5',x,y+g+i*(60+g),zc,w);return`${n} פרופילים אופקיים, מרווח ${fmt(g)} מ״מ`}
 if(s==='s'||s==='m'){const k=Math.max(0,Math.ceil(h/900)-1),zc=z+(df-20)/2;
  for(let i=1;i<=k;i++)bx('קורת חיזוק','40×20×2',x,y+i*h/(k+1)-20,zc,w);
  box(x,y,z+df/2-1,w,h,2,s==='s'?'sheet':'mesh');
  HW.push(s==='s'?`פח 1.5 מ״מ ${fmt(w)}×${fmt(h)}`:`רשת מרותכת 50×50×4 ${fmt(w)}×${fmt(h)}`);return s==='s'?'פח מרותך למסגרת + קורות חיזוק':'רשת מרותכת למסגרת + קורות חיזוק'}
 return'';
}
function parts(){const m=new Map();for(const e of M)if(e.n){const k=e.n+'|'+e.p+'|'+Math.round(e.len);m.has(k)?m.get(k)[3]++:m.set(k,[e.n,e.p,Math.round(e.len),1,e.ang||0])}return[...m.values()]}
function hwList(){const c=new Map();for(const h of HW)c.set(h,(c.get(h)||0)+1);return[...c].map(([h,q])=>q>1?`${q}× ${h}`:h)}
// ---- projection ----
const VIEWS={
 front:{t:'חזית',V:[0,0,-1],P:p=>[p[0],-p[1]]},
 side:{t:'מבט צד',V:[1,0,0],P:p=>[p[2],-p[1]]},
 top:{t:'מבט על',V:[0,1,0],P:p=>[p[0],-p[2]]},
 iso:{t:'איזומטרי',V:[.57735,.57735,-.57735],P:p=>[(p[0]+p[2])*.7071,(p[0]-2*p[1]-p[2])*.4082]}};
const COL={m:['#DCE1E6','#F1F3F5','#B9C1CA'],post:['#F9C7A3','#FCDCC4','#F0A06B'],wheel:['#F9C7A3','#FCDCC4','#F0A06B'],sheet:['#C9D3DC','#DCE3EA','#AEB9C4'],
 mesh:['url(#mh)','url(#mh)','url(#mh)'],wood:['#EADBC8','#F3E7D8','#D9C3A8'],wall:['url(#wh)','#ECEDEF','#DADCE0'],track:['#9AA3AB','#B5BCC3','#7E8890'],conc:['#E3E5E8','#EEF0F2','#CDD1D6']};
let PAINT=null;const PAINTS={blk:['#3A3F45','#555B62','#25292D'],ant:['#4A5056','#666C73','#373C41'],wht:['#F4F5F6','#FFFFFF','#D9DCDF'],grn:['#3E5A47','#56735F','#2D4434'],brn:['#5B4636','#76604E','#46352A'],gal:['#C3C9CF','#D8DCE0','#A7AFB7']};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function faces(e){const A=e.A,B=e.B,n=A.length,f=[A,[...B].reverse()];for(let i=0;i<n;i++){const j=(i+1)%n;f.push([A[i],A[j],B[j],B[i]])}
 const c=[0,1,2].map(k=>(A.reduce((s,p)=>s+p[k],0)+B.reduce((s,p)=>s+p[k],0))/(2*n));
 return f.map(F=>{const fc=[0,1,2].map(k=>F.reduce((s,p)=>s+p[k],0)/F.length);let N=[0,0,0];
  for(let i=0;i<F.length;i++){const a=F[i],b=F[(i+1)%F.length];N[0]+=(a[1]-b[1])*(a[2]+b[2]);N[1]+=(a[2]-b[2])*(a[0]+b[0]);N[2]+=(a[0]-b[0])*(a[1]+b[1])}
  const l=Math.hypot(...N)||1;N=N.map(v=>v/l);if(dot(N,[fc[0]-c[0],fc[1]-c[1],fc[2]-c[2]])<0)N=N.map(v=>-v);return{F,N,fc}})}
const DEFS=`<defs><pattern id="mh" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0L14 14M14 0L0 14" stroke="#7E8890" stroke-width=".8"/></pattern><pattern id="wh" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#ECEDEF"/><path d="M0 12L12 0" stroke="#AEB4BB" stroke-width=".8"/></pattern></defs>`;
function view(vk,o={}){
 const v=VIEWS[vk],iso=vk==='iso',polys=[];
 for(const e of M)for(const f of faces(e)){if(dot(f.N,v.V)<=1e-6)continue;
  const d=dot(f.fc,v.V),cat=iso?(f.N[1]>.5?1:(f.N[2]<-.5?0:2)):0,fill=(PAINT&&/^(m|post|wheel)$/.test(e.role)?PAINTS[PAINT]:(COL[e.role]||COL.m))[cat];
  polys.push({d,pts:f.F.map(v.P),fill,e})}
 polys.sort((a,b)=>a.d-b.d);
 const all=polys.flatMap(p=>p.pts);if(!all.length)return'';
 let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
 const S=Math.max(x1-x0,y1-y0),fs=S/24,pad=o.thumb?S*.03:S*.16;let s='';
 for(const p of polys)s+=`<polygon points="${p.pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="${p.fill}" stroke="${INK}" stroke-width="${o.thumb?.6:.9}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
 if(!o.thumb){
  if(vk==='front'||vk==='side'){const gy=0;if(y1>=gy-1)s+=`<line x1="${x0-S*.08}" y1="${gy}" x2="${x1+S*.08}" y2="${gy}" stroke="${ST}" stroke-width="1.2" stroke-dasharray="8 5" vector-effect="non-scaling-stroke"/>`}
  if(!iso){const L=(a,b,c,d,w=1)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${ST}" stroke-width="${w}" vector-effect="non-scaling-stroke"/>`,t=fs*.3;
   const yb=y1+fs*1.6,xl=x0-fs*1.6,T=(x,y,txt,r)=>`<text x="${x}" y="${y}" fill="${OT}" font-size="${fs}" font-family="Heebo" font-weight="700" text-anchor="middle"${r?` transform="rotate(-90 ${x} ${y})"`:''}>${txt}</text>`;
   s+=L(x0,yb,x1,yb)+L(x0,yb-t,x0,yb+t)+L(x1,yb-t,x1,yb+t)+L(x0,y1+t,x0,yb-t,.6)+L(x1,y1+t,x1,yb-t,.6)+T((x0+x1)/2,yb-fs*.3,fmt(x1-x0)+' מ״מ');
   s+=L(xl,y0,xl,y1)+L(xl-t,y0,xl+t,y0)+L(xl-t,y1,xl+t,y1)+T(xl-fs*.35,(y0+y1)/2,fmt(y1-y0)+' מ״מ',1)}
  if(vk==='front'&&o.balloons){const seen=new Set(),bl=[];
   o.balloons.forEach((pt,i)=>{const e=M.find(e=>e.n&&e.n+'|'+e.p+'|'+Math.round(e.len)===pt);if(!e)return;
    const fr=faces(e).find(f=>f.N[2]<-.5)||faces(e)[0],c=v.P(fr.fc);bl.push([c,i+1])});
   const r=fs*.62;for(const[[cx,cy],k] of bl)s+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*1.6}" y2="${cy-r*1.6}" stroke="${OT}" stroke-width=".8" vector-effect="non-scaling-stroke"/><circle cx="${cx+r*2.3}" cy="${cy-r*2.3}" r="${r}" fill="#fff" stroke="${OT}" stroke-width="1.2" vector-effect="non-scaling-stroke"/><text x="${cx+r*2.3}" y="${cy-r*2.3+r*.38}" fill="${OT}" font-size="${r*1.1}" font-family="Heebo" font-weight="700" text-anchor="middle">${k}</text>`}
 }
 return`<svg viewBox="${x0-pad} ${y0-pad} ${x1-x0+2*pad} ${y1-y0+2*pad}" direction="ltr" role="img" aria-label="${v.t}">${DEFS}${s}</svg>`;
}

// ===== generators (3D). Each f() fills M / HW and returns {hw,notes,name?} =====
const S4=['v','h','s','m'];

 parts.forEach(([n,p,len,q],pi)=>{for(let i=0;i<q;i++){if(len>STOCK){const k=Math.ceil(len/(STOCK-KERF));joins.add(n);for(let j=0;j<k;j++)(by[p]??=[]).push({l:len/k,i:pi,j:1})}else(by[p]??=[]).push({l:len,i:pi})}});
 const rows=Object.entries(by).map(([p,arr])=>{arr.sort((a,b)=>b.l-a.l);const bins=[];
  for(const pc of arr){const b=bins.find(b=>b.rem>=pc.l+KERF);if(b){b.rem-=pc.l+KERF;b.pc.push(pc)}else bins.push({rem:STOCK-pc.l-KERF,pc:[pc]})}
  const used=arr.reduce((a,b)=>a+b.l,0);return{p,bars:bins.length,m:used/1000,waste:1-used/(bins.length*STOCK),kg:used/1000*kgm(p),bins}});
 return{rows,joins:[...joins]};
}
function cutSVG(row){
 const H=380,G=110,W=STOCK,groups=[];
 for(const b of row.bins){const sig=b.pc.map(x=>x.i+':'+Math.round(x.l)).join('|');const g=groups.find(g=>g.sig===sig);g?g.n++:groups.push({sig,b,n:1})}
 const hh=groups.length*(H+G);let s='';
 groups.forEach((g,r)=>{const y=r*(H+G);let x=0;
  s+=`<rect x="0" y="${y}" width="${W}" height="${H}" fill="url(#cw)" stroke="${INK}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  for(const pc of g.b.pc){s+=`<rect x="${x}" y="${y}" width="${pc.l}" height="${H}" fill="${pc.j?'#FCDCC4':'#DCE1E6'}" stroke="${INK}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
   if(pc.l>1100)s+=`<text x="${x+pc.l/2}" y="${y+H*.68}" font-size="${H*.5}" font-family="Heebo" font-weight="700" text-anchor="middle" fill="${INK}">#${pc.i+1} · ${fmt(pc.l)} מ״מ</text>`;
   else s+=`<text x="${x+pc.l/2}" y="${y+H*.68}" font-size="${H*.42}" font-family="Heebo" font-weight="700" text-anchor="middle" fill="${INK}">${pc.i+1}</text>`;
   x+=pc.l+KERF}
  if(g.b.rem>200)s+=`<text x="${x+g.b.rem/2}" y="${y+H*.68}" font-size="${H*.42}" font-family="Heebo" text-anchor="middle" fill="${ST}">שארית ${fmt(g.b.rem)} מ״מ</text>`;
  s+=`<text x="${W+120}" y="${y+H*.68}" font-size="${H*.55}" font-family="Heebo" font-weight="900" fill="${OT}">×${g.n}</text>`});
 return`<svg viewBox="-20 -20 ${W+900} ${hh+40}" direction="ltr" preserveAspectRatio="xMinYMin meet" style="width:100%;height:auto"><defs><pattern id="cw" width="160" height="160" patternUnits="userSpaceOnUse"><rect width="160" height="160" fill="#fff"/><path d="M0 160L160 0" stroke="#C9CED4" stroke-width="18"/></pattern></defs>${s}</svg>`}
function cutHTML(rows){return`<h2>סימון חיתוכים על המוט</h2><p class="muted" style="font-size:14px">כל פס = מוט 6 מ׳. המספר תואם לרשימת החיתוך; אורכי החיתוך מסומנים במ״מ; ×N = כמה מוטות לחתוך בדיוק כך. חותכים משמאל לימין לפי הסדר, עובי מסור ${KERF} מ״מ.</p>`+rows.map(r=>`<div class="cutp"><b dir="ltr">${r.p}</b> – ${r.bars} מוטות${cutSVG(r)}</div>`).join('')}
function dxf(p){
 M=p.model;const L=[];const add=(...a)=>L.push(...a);
 add('0','SECTION','2','HEADER','9','$INSUNITS','70','4','0','ENDSEC','0','SECTION','2','ENTITIES');
 const lay={front:'FRONT',side:'SIDE',top:'TOP'};let ox=0;const off={};
 const ext=vk=>{const v=VIEWS[vk];let a=[];for(const e of M)for(const q of[...e.A,...e.B]){const t=v.P(q);a.push(t)}return{x0:Math.min(...a.map(t=>t[0])),x1:Math.max(...a.map(t=>t[0])),y0:Math.min(...a.map(t=>-t[1])),y1:Math.max(...a.map(t=>-t[1]))}};
 const ef=ext('front'),es=ext('side'),et=ext('top'),gap=Math.max(ef.x1-ef.x0,ef.y1-ef.y0)*.25;
 off.front=[-ef.x0,-ef.y0];off.side=[-es.x0+(ef.x1-ef.x0)+gap,-es.y0];off.top=[-et.x0,-et.y0+(ef.y1-ef.y0)+gap];
 for(const vk of['front','side','top']){const v=VIEWS[vk],[dx,dy]=off[vk];
  for(const e of M)for(const f of faces(e)){if(dot(f.N,v.V)<=1e-6)continue;
   add('0','POLYLINE','8',lay[vk],'66','1','70','1');for(const q of f.F){const t=v.P(q);add('0','VERTEX','8',lay[vk],'10',(t[0]+dx).toFixed(2),'20',(-t[1]+dy).toFixed(2),'30','0')}add('0','SEQEND','8',lay[vk])}
  const ex={front:ef,side:es,top:et}[vk];add('0','TEXT','8','TEXT','10',dx+ex.x0+'', '20',(dy+ex.y0-gap*.35).toFixed(1),'30','0','40',(gap*.12).toFixed(1),'1',{front:'FRONT',side:'SIDE',top:'TOP'}[vk]+' '+fmt(ex.x1-ex.x0)+' x '+fmt(ex.y1-ex.y0)+' mm')}
 add('0','TEXT','8','TEXT','10','0','20',(-gap*.9).toFixed(1),'30','0','40',(gap*.15).toFixed(1),'1',p.id+' - units mm');
 add('0','ENDSEC','0','EOF');return L.join('\r\n');
}
function dlDXF(p){const b=new Blob([dxf(p)],{type:'application/dxf'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=p.id.replace(/[:]/g,'_')+'.dxf';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function surf(p){const[a,b]=sec(p);return 2*(a+b)/1000} // m² per m length
function calcs(p){
 let area=0,weld=0;for(const[n,pr,l,q]of p.parts){area+=surf(pr)*l/1000*q;const[a,b]=sec(pr);weld+=q*2*Math.min(2*(a+b),400)}
 const sheet=p.model.filter(e=>e.role==='sheet').reduce((s,e)=>{const xs=e.A.map(q=>q[0]),ys=e.A.map(q=>q[1]);return s+(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys))/1e6*2},0);
 const A=area+sheet,coats=3,cov=8,lit=A*coats/cov,wm=weld/1000;
 return{A,lit,wm,elec:Math.ceil(wm/0.15),wire:wm*.03,gasL:wm/0.25*12,hrs:wm/0.25/60}}

function secProps(pr){const[h0,b0,t0]=pr.split('×').map(Number);const h=Math.max(h0,b0),b=Math.min(h0,b0);if(!t0)return{I:b*h**3/12,W:b*h**2/6};const t=t0,I=(b*h**3-(b-2*t)*(h-2*t)**3)/12;return{I,W:I/(h/2)}}

 $('opt').onclick=()=>{const G={};for(const r of p.parts){(G[r[1]]??=[]).push({length:r[2],qty:r[3],note:r[0]})}localStorage.setItem('mp_optimizer_input_v1',JSON.stringify({planId:p.id,planName:p.name,projectUid:projectUid||'',groups:Object.entries(G).map(([profile,parts])=>({profile,parts}))}));location.href='optimizer.html'};
 $('qpdf').onclick=()=>{const q=p.q,S2=getSet(),d=new Date().toLocaleDateString('he-IL');M=p.model;const iso=view('iso',{thumb:1});
  const w=window.open('','_blank');if(!w){alert('יש לאפשר חלונות קופצים');return}
  w.document.write(`<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>הצעת מחיר – ${p.name}</title><style>body{font-family:Heebo,Arial,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#15181C}h1{font-size:28px;margin:8px 0}table{width:100%;border-collapse:collapse;margin:12px 0}td{border-bottom:1px solid #ddd;padding:8px}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #E8590C;padding-bottom:10px}.tot td{font-size:20px;font-weight:900;color:#B93E07}svg{width:100%;max-height:260px}.m{color:#5B6670;font-size:13px}</style></head><body>
  <div class="hd"><div><b style="font-size:20px">${S2.biz||'שם העסק'}</b><br>${S2.phone||''}</div>${S2.logo?`<img src="${S2.logo}" style="max-height:80px">`:''}</div>
  <h1>הצעת מחיר</h1><p>לכבוד: <b>${$('qc').value||'________'}</b> · תאריך: ${d}</p>
  <p><b>${p.name}</b> – ${sz(p)} · חומר: ${MAT[q.m].n} · גימור: ${MAT[q.m].fn}</p>${iso}
  <table><tr><td>חומר ומתכלים</td><td>₪${fmt(q.mat+q.cons)}</td></tr><tr><td>${MAT[q.m].fn}</td><td>₪${fmt(q.fin)}</td></tr><tr><td>ייצור והתקנה</td><td>₪${fmt(q.lab+q.pr)}</td></tr><tr><td>סה״כ לפני מע״מ</td><td>₪${fmt(q.net)}</td></tr><tr><td>מע״מ</td><td>₪${fmt(q.vat)}</td></tr><tr class="tot"><td>סה״כ לתשלום</td><td>₪${fmt(q.tot)}</td></tr></table>
  <p class="m">ההצעה בתוקף ל-14 יום. המחיר כולל ייצור לפי המידות שלעיל; שינויים במידות או בחומר יתומחרו מחדש. תכנון הנדסי / היתרים – אינם כלולים אלא אם צוין.</p>
  <p style="margin-top:40px">חתימת הלקוח: ______________</p><script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()};
}

// ===== catalog + UI =====
const range=a=>a.length===3&&typeof a[0]==='number'&&a[2]<a[0]?(()=>{const r=[];for(let v=a[0];v<=a[1];v+=a[2])r.push(v);return r})():a;
const PLANS=[];
for(const[k,g]of Object.entries(GEN))for(const W of range(g.W))for(const H of range(g.H))if(!g.ok||g.ok(W,H))for(const s of(g.S||['']))PLANS.push({id:[k,W,H,s].filter(x=>x!=='').join('-'),k,W,H,s});
function kgm(p){const v=p.split('×').map(Number);const a=v.length===3?2*(v[0]+v[1])*v[2]-4*v[2]*v[2]:v[0]*v[1];return a*7.85/1000}
const sz=x=>{const g=GEN[x.k];return`${g.wl} ${fmt(x.W)} ${unitOf(g.W)} · ${g.hl} ${fmt(x.H)} ${unitOf(g.H)}${x.s?' · '+SN[x.s]:''}`};
function build(x){const g=GEN[x.k];M=[];HW=[];const r=g.f(x.W,x.H,x.s);return{...x,name:r.name||g.name,notes:r.notes.filter(Boolean),hw:[...r.hw,...hwList()],parts:parts(),model:M}}
const plan=id=>{if(id.startsWith('c:'))return customPlan(id);const x=PLANS.find(p=>p.id===id);return x?build(x):null};
const st={k:'SG',w:'',h:'',s:'',shown:24,sel:null};
const $=id=>document.getElementById(id);
function thumb(x){const p=build(x);M=p.model;return view('iso',{thumb:1})}
$('total').textContent=`${PLANS.length.toLocaleString('en-US')} תוכניות ב-${Object.keys(GEN).length} סוגי עבודה ב-${CATS.length} קטגוריות. לכל תוכנית: 4 מבטי שרטוט (חזית, צד, על, איזומטרי), רשימת חיתוך ממוספרת, כמות פרופילים ופרזול.`;
const btn=k=>`<button data-k="${k}">${GEN[k].name} <span class="muted">(${PLANS.filter(p=>p.k===k).length})</span></button>`;
$('types').innerHTML=CATS.map(([c,ks])=>`<div class="grp"><span class="gt">${c}</span>${ks.map(btn).join('')}</div>`).join('');
typeToggle.onclick=()=>{const open=$('types').classList.toggle('open');typeToggle.setAttribute('aria-expanded',open?'true':'false')};
$('types').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.k=b.dataset.k;st.w=st.h=st.s='';st.shown=24;fillSel();render();if(innerWidth<=760){$('types').classList.remove('open');typeToggle.setAttribute('aria-expanded','false')}};
function fillSel(){
 const ps=PLANS.filter(p=>p.k===st.k),g=GEN[st.k];if(window.currentType)currentType.textContent=g.name;
 const opt=(arr,v,f)=>`<option value="">הכול</option>`+[...new Set(arr)].map(x=>`<option value="${x}" ${x==v?'selected':''}>${f(x)}</option>`).join('');
 $('lw').textContent=`${g.wl} (${unitOf(g.W)})`;$('fw').innerHTML=opt(ps.map(p=>p.W),st.w,x=>fmt(x)+' '+unitOf(g.W));
 $('lh').textContent=`${g.hl} (${unitOf(g.H)})`;$('fh').innerHTML=opt(ps.map(p=>p.H),st.h,x=>fmt(x)+' '+unitOf(g.H));
 $('sw').style.display=g.S?'':'none';if(g.S)$('fs').innerHTML=opt(g.S,st.s,x=>SN[x]);
 [...$('types').children].forEach(b=>b.classList.toggle('on',b.dataset.k===st.k));
}
$('fw').onchange=e=>{st.w=e.target.value;st.shown=24;render()};
$('fh').onchange=e=>{st.h=e.target.value;st.shown=24;render()};
$('fs').onchange=e=>{st.s=e.target.value;st.shown=24;render()};
$('more').onclick=()=>{st.shown+=24;render()};
function render(){
 const ps=PLANS.filter(p=>p.k===st.k&&(!st.w||p.W==st.w)&&(!st.h||p.H==st.h)&&(!st.s||p.s===st.s));
 $('count').textContent=`${ps.length.toLocaleString('en-US')} תוכניות`;
 $('list').innerHTML=ps.slice(0,st.shown).map(x=>`<button class="item ${st.sel===x.id?'sel':''}" data-id="${x.id}">${thumb(x)}<b>${GEN[x.k].name}</b><span style="display:block">${sz(x)}</span><span class="code" dir="ltr">${x.id}</span></button>`).join('');
 $('more').style.display=ps.length>st.shown?'block':'none';
}
$('list').onclick=e=>{const b=e.target.closest('.item');if(b)location.hash=b.dataset.id};
function show(id){
 const p=plan(id);if(p&&p.err){alert(p.err);return}if(!p){$('detail').innerHTML='';document.body.style.overflow='';return}
 if(p.k!==st.k){st.k=p.k;st.w=st.h=st.s='';fillSel()}st.sel=id;render();
 M=p.model;const keys=p.parts.map(([n,pr,l])=>n+'|'+pr+'|'+l);
 const {rows,joins}=pack(p.parts),bars=rows.reduce((a,r)=>a+r.bars,0),kg=rows.reduce((a,r)=>a+r.kg,0);
 const V=k=>`<figure class="vw"><figcaption>${VIEWS[k].t}</figcaption>${view(k,k==='front'?{balloons:keys}:{})}</figure>`;
 const today=new Date().toLocaleDateString('he-IL');
 $('detail').innerHTML=`<div class="card" style="margin-top:8px"><button class="close no-print" id="x" aria-label="סגירה">✕</button>
 <h2>${p.name}${p.custom?' <span class="soon2">מידה מותאמת</span>':''}</h2><p style="font-size:18px;font-weight:700;margin-bottom:6px">${sz(p)}</p>
 <div class="meta"><span>קוד: <b class="code" dir="ltr">${id}</b></span><span>פרופילים לקנייה: <b>${bars}</b></span><span>משקל פלדה משוער: <b>${fmt(kg)} ק״ג</b></span><span>חלקים: <b>${p.parts.reduce((a,r)=>a+r[3],0)}</b></span></div>
 ${colorBar()}<div class="views">${V('front')}${V('side')}${V('top')}${V('iso')}</div>
 <table class="tb"><tr><td>שם: <b>${p.name}</b></td><td>קוד: <b dir="ltr">${id}</b></td><td>יחידות: מ״מ</td></tr><tr><td>קנ״מ: ללא (NTS)</td><td>תאריך הפקה: ${today}</td><td>גיליון 1/1 · גרסה 2.0</td></tr></table>
 <h2>רשימת חיתוך</h2><p class="muted" style="font-size:14px">המספרים תואמים לסימון בשרטוט החזית.</p><div class="tbl"><table><tr><th>#</th><th>חלק</th><th>פרופיל <span class="thunit">חתך במ״מ</span></th><th>אורך <span class="thunit">מ״מ</span></th><th>כמות</th><th>חיתוך</th></tr>
 ${p.parts.map(([n,pr,l,q,a],i)=>`<tr><td><b class="bn">${i+1}</b></td><td>${n}</td><td>${ltr(pr)}</td><td>${fmt(l)}</td><td>${q}</td><td>${a?`<b>${a}°</b>`:'90°'}</td></tr>`).join('')}</table></div>
 <h2>קנייה – פרופילים של 6 מ׳</h2><div class="tbl"><table><tr><th>פרופיל <span class="thunit">חתך במ״מ</span></th><th>מוטות <span class="thunit">6 מ׳</span></th><th>אורך נטו <span class="thunit">מ׳</span></th><th>פחת</th></tr>
 ${rows.map(r=>`<tr><td>${ltr(r.p)}</td><td><b>${r.bars}</b></td><td>${r.m.toFixed(1)}</td><td>${Math.round(r.waste*100)}%</td></tr>`).join('')}</table></div>
 <p class="muted" style="font-size:14px;margin-top:6px">חיתוך אופטימלי עם ${KERF} מ״מ עובי מסור לכל חיתוך.</p>
 ${cutHTML(rows)}
 ${joins.length?`<div class="warn">⚠️ ארוך מ-6 מ׳ – נדרש חיבור / ריתוך המשך: ${joins.join(', ')}</div>`:''}
 <h2>פרזול, חיפוי ואביזרים</h2><ul style="padding-inline-start:20px">${p.hw.map(h=>`<li>${h}</li>`).join('')}</ul>
 <h2>הערות</h2><ul style="padding-inline-start:20px">${p.notes.map(h=>`<li>${h}</li>`).join('')}</ul>
 ${toolsHTML(p,rows)}${moreHTML(p)}<div class="warn">תבנית עבודה בלבד. פרופילים, עיגון ועומסים – באחריות המבצע ולפי התקן ותנאי האתר.</div>
 <p class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" onclick="print()">הדפסה / שמירה כ-PDF</button><button class="btn ghost" id="cp">העתקת קישור</button></p></div>`;
 $('cp').onclick=()=>{navigator.clipboard?.writeText(location.href).then(()=>$('cp').textContent='הקישור הועתק ✓',()=>{})};
 bindTools(p,rows);bindMore(p);$('dxf').onclick=()=>dlDXF(p);document.querySelectorAll('.cbar button[data-c]').forEach(b=>b.onclick=()=>{PAINT=b.dataset.c||null;const y=$('detail').scrollTop;show(id);$('detail').scrollTop=y});$('x').onclick=closeD;$('detail').scrollTop=0;document.body.style.overflow='hidden';
}
function closeD(){history.pushState(null,'',location.pathname+location.search);show('')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
$('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeD()});
window.onhashchange=()=>show(decodeURIComponent(location.hash.slice(1)));
const q=new URLSearchParams(location.search).get('type');if(q&&GEN[q])st.k=q;
fillSel();render();if(location.hash)show(decodeURIComponent(location.hash.slice(1)));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
<script src="worksheet.js"></script><script src="forge-plus.js"></script>
</body>
</html>
