<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ספריית התוכניות | תוכניות עבודה למסגרים</title>
<meta name="description" content="מאות תוכניות עבודה למסגרים: שערים נגררים, שערי כנף, פשפשים, מעקות, סורגים וגדרות – שרטוט, רשימת חיתוך וכמות פרופילים.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F6;--bg2:#FFFFFF;--line:#D6DAE0;--or:#E8590C;--ort:#B93E07;--steel:#5B6670;--tx:#15181C}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select{font-family:inherit}
html,body{overflow-x:hidden}
body{font-family:Heebo,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:20px 0;border-bottom:1px solid var(--line)}
header a{color:var(--tx);text-decoration:none;font-weight:900}
h1{font-size:clamp(30px,6vw,52px);font-weight:900;line-height:1.1;margin:28px 0 8px}
h2{font-size:clamp(22px,4vw,32px);font-weight:900;margin:24px 0 12px}
.hl{background:var(--or);color:#fff;padding:0 .15em}
.muted{color:var(--steel)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.filters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));margin:20px 0}
.filters label{display:block;font-weight:700;margin-bottom:4px;font-size:15px}
select{width:100%;padding:12px;font-size:17px;background:var(--bg);color:var(--tx);border:1px solid var(--steel);border-radius:8px}
.types{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.types button{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;font-weight:700}
.types button.on{background:var(--or);color:#fff;border-color:var(--or)}
.types button.on .muted{color:#fff}
#detail:not(:empty){position:fixed;inset:0;z-index:20;background:rgba(20,24,28,.55);overflow-y:auto;padding:12px}
#detail .card{max-width:920px;margin:0 auto 40px}
.close{position:sticky;top:0;float:left;background:var(--bg);color:var(--tx);border:1px solid var(--steel);border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer;z-index:2}
@media(max-width:520px){main .list{grid-template-columns:1fr 1fr}.item{padding:8px;font-size:13px}.item b{font-size:14px}.item svg{height:64px}}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr))}
.item{display:block;text-align:right;background:var(--bg2);box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--tx);cursor:pointer;font-size:15px}
.item:hover,.item.sel{border-color:var(--or)}
.item b{display:block;font-size:16px}
.item svg{width:100%;height:90px;display:block;margin-bottom:6px}
.code{font-family:ui-monospace,Consolas,monospace;color:var(--ort);font-size:13px}
#detail svg{width:100%;height:auto;max-height:520px;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
table{width:100%;border-collapse:collapse;background:var(--bg2);margin-top:8px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:15px}
th{background:#EEF1F4;color:var(--ort)}
.tbl{overflow-x:auto}
.btn{display:inline-block;background:var(--or);color:#fff;font-weight:900;font-size:17px;padding:12px 22px;border-radius:8px;border:0;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--steel)}
.warn{border-right:4px solid var(--or);padding:12px 14px;background:#FFF4EC;border-radius:8px;margin:16px 0;font-size:14px}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
.meta>span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.count{font-size:15px;margin:10px 0}
.more{margin:16px auto;display:block}
footer{padding:40px 0;color:var(--steel);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
[dir=ltr]{unicode-bidi:isolate}
@media print{
 #detail:not(:empty){position:static;background:none;padding:0;overflow:visible}.close{display:none}
 body{background:#fff;color:#000}header,.filters,.types,.list,.more,.no-print,footer,.count,#intro{display:none!important}
 #detail svg{background:#fff;max-height:none}.card{border:1px solid #999;background:#fff}
 th{background:#eee;color:#000}td,th{border-color:#bbb}.warn{background:#f5f5f5;color:#000}.muted{color:#444}
}
</style>
</head>
<body>
<header><div class="wrap"><a href="index.html">← תוכניות עבודה למסגרים</a></div></header>
<main class="wrap">
 <div id="intro">
  <h1>ספריית <span class="hl">התוכניות</span></h1>
  <p class="muted" id="total"></p>
  <div class="types" id="types"></div>
  <div class="filters">
   <div><label for="fw">רוחב / אורך</label><select id="fw"></select></div>
   <div><label for="fh">גובה</label><select id="fh"></select></div>
  </div>
  <p class="count" id="count"></p>
 </div>
 <div class="list" id="list"></div>
 <button class="btn ghost more" id="more">הצג עוד</button>
 <section id="detail"></section>
</main>
<footer><div class="wrap">התוכניות הן תבניות עבודה לעבודות מסגרות נפוצות ואינן מחליפות תכנון הנדסי. יש לוודא התאמה לתקנים הרלוונטיים (למשל ת״י 1142 למעקות, ת״י 900-21.03 לשערים חשמליים) ולתנאי האתר.</div></footer>
<script>
const OR='#E8590C',OT='#B93E07',WH='#1F2328',ST='#6B7680',FILL='#DCE1E6',STOCK=6000,KERF=3;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const ltr=t=>`<span dir="ltr">${t}</span>`;
const R=(x,y,w,h,c=WH,f=FILL)=>({t:'r',x,y,w,h,c,f});
const Lh=(x1,y1,x2,y2,c=ST,d)=>({t:'l',x1,y1,x2,y2,c,d});
const C=(x,y,r)=>({t:'c',x,y,r});
const D=(x1,y1,x2,y2,t)=>({x1,y1,x2,y2,t});

function draw(W,H,shapes,dims,thumb){
 const M=Math.max(W,H),pad=M*(thumb?.04:.13),fs=M/26;
 let s='';
 for(const r of shapes){
  if(r.t==='r')s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${r.f}" stroke="${r.c}" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`;
  else if(r.t==='l')s+=`<line x1="${r.x1}" y1="${r.y1}" x2="${r.x2}" y2="${r.y2}" stroke="${r.c}" stroke-width="1.4" ${r.d?'stroke-dasharray="6 5"':''} vector-effect="non-scaling-stroke"/>`;
  else s+=`<circle cx="${r.x}" cy="${r.y}" r="${r.r}" fill="none" stroke="${OR}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
 }
 if(!thumb)for(const d of dims){
  const t=fs*.35,ln=(a,b,c,e)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="${ST}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  if(d.y1===d.y2){s+=ln(d.x1,d.y1,d.x2,d.y2)+ln(d.x1,d.y1-t,d.x1,d.y1+t)+ln(d.x2,d.y2-t,d.x2,d.y2+t)+
   `<text x="${(d.x1+d.x2)/2}" y="${d.y1-fs*.35}" fill="${OT}" font-size="${fs}" font-family="Heebo" font-weight="700" text-anchor="middle">${d.t}</text>`}
  else{const cy=(d.y1+d.y2)/2,cx=d.x1-fs*.35;s+=ln(d.x1,d.y1,d.x2,d.y2)+ln(d.x1-t,d.y1,d.x1+t,d.y1)+ln(d.x2-t,d.y2,d.x2+t,d.y2)+
   `<text x="${cx}" y="${cy}" fill="${OT}" font-size="${fs}" font-family="Heebo" font-weight="700" text-anchor="middle" transform="rotate(-90 ${cx} ${cy})">${d.t}</text>`}
 }
 const x0=Math.min(0,...shapes.map(r=>r.t==='r'?r.x:r.t==='l'?Math.min(r.x1,r.x2):r.x-r.r));
 const x1=Math.max(W,...shapes.map(r=>r.t==='r'?r.x+r.w:r.t==='l'?Math.max(r.x1,r.x2):r.x+r.r));
 const y1=Math.max(H,...shapes.map(r=>r.t==='r'?r.y+r.h:r.t==='l'?Math.max(r.y1,r.y2):r.y+r.r));
 const y0=Math.min(0,...shapes.map(r=>r.t==='r'?r.y:r.t==='l'?Math.min(r.y1,r.y2):r.y-r.r));
 return `<svg viewBox="${x0-pad} ${y0-pad} ${x1-x0+2*pad} ${y1-y0+2*pad}" direction="ltr" role="img" aria-label="שרטוט">${s}</svg>`;
}
function barsAcross(inner,bw=20,gap=100){const n=Math.max(0,Math.ceil((inner-gap)/(gap+bw)));return {n,sp:(inner-n*bw)/(n+1)}}
function vbars(x0,inner,y,h,bw=20){const {n,sp}=barsAcross(inner,bw);const a=[];for(let i=0;i<n;i++)a.push(R(x0+sp+i*(bw+sp),y,bw,h));return {a,n,sp}}
</script>
<script>
const GEN={
 SG:{name:'שער נגרר',wl:'רוחב פתח',W:[3000,6000,250],H:[1200,1400,1600,1800,2000],f(W,H){
  const big=W>4000,f=big?80:60,p=big?'80×40×2.5':'60×40×2',L=W+300,inH=H-2*f,inL=L-2*f;
  const b=vbars(f,inL,f,inH);
  return{L,H,parts:[['קורה עליונה + תחתונה',p,L,2],['עמוד קצה',p,inH,2],['מוט מילוי','20×20×1.5',inH,b.n]],
   shapes:[R(0,0,L,f),R(0,H-f,L,f),R(0,f,f,inH),R(L-f,f,f,inH),...b.a,C(L*.18,H+45,45),C(L*.82,H+45,45),Lh(-250,H+90,L+250,H+90)],
   dims:[D(0,-L*.05,L,-L*.05,fmt(L)),D(-L*.05,0,-L*.05,H,fmt(H))],
   hw:['2 גלגלי מסילה מתאימים למשקל הכנף',`מסילה תחתונה באורך ~${fmt(2*W+300)} מ״מ`,'מוביל עליון עם גלגלות + עצר קצה'],
   notes:[`כנף = פתח + 300 מ״מ חפיפה`,`מרווח בין מוטות: ${fmt(b.sp)} מ״מ`,'לשער ממונע – לפי ת״י 900-21.03, כולל מניעת לכידה']}}},
 DG:{name:'שער כנף כפול',wl:'רוחב פתח',W:[2500,4500,250],H:[1200,1400,1600,1800,2000],f(W,H){
  const f=W<=3500?50:60,p=f===50?'50×50×2':'60×40×2',lw=(W-30)/2,inH=H-2*f,inW=lw-2*f,xs=[10,20+lw];
  let sh=[R(-100,-60,100,H+160,OR,'none'),R(W,-60,100,H+160,OR,'none')],n=0,sp=0;
  for(const x of xs){const b=vbars(x+f,inW,f,inH);n=b.n;sp=b.sp;sh.push(R(x,0,lw,f),R(x,H-f,lw,f),R(x,f,f,inH),R(x+lw-f,f,f,inH),...b.a)}
  return{L:W,H,parts:[['קורה עליונה + תחתונה',p,lw,4],['עמוד כנף',p,inH,4],['מוט מילוי','20×20×1.5',inH,n*2]],
   shapes:sh,dims:[D(0,-W*.06,W,-W*.06,fmt(W)),D(-W*.09,0,-W*.09,H,fmt(H))],
   hw:['4 צירים (2 לכל כנף)','בריח רצפה + מנעול מרכזי','עצר אמצעי'],
   notes:[`רוחב כנף: ${fmt(lw)} מ״מ (מרווח 10 מ״מ בצירים ובאמצע)`,`מרווח בין מוטות: ${fmt(sp)} מ״מ`]}}},
 PP:{name:'פשפש',wl:'רוחב פתח',W:[900,1200,100],H:[1800,1900,2000,2100],f(W,H){
  const f=40,p='40×40×2',lw=W-20,inH=H-2*f,inW=lw-2*f,seg=(inH-f)/2,x=10;
  const top=vbars(x+f,inW,f,seg),bot=vbars(x+f,inW,f*2+seg,seg);
  return{L:W,H,parts:[['קורה עליונה + תחתונה',p,lw,2],['עמוד כנף',p,inH,2],['קורת אמצע',p,inW,1],['מוט מילוי','20×20×1.5',seg,top.n*2]],
   shapes:[R(-80,-50,80,H+100,OR,'none'),R(W,-50,80,H+100,OR,'none'),R(x,0,lw,f),R(x,H-f,lw,f),R(x,f,f,inH),R(x+lw-f,f,f,inH),R(x+f,f+seg,inW,f),...top.a,...bot.a],
   dims:[D(0,-H*.05,W,-H*.05,fmt(W)),D(-H*.09,0,-H*.09,H,fmt(H))],
   hw:['2–3 צירים','מנעול + ידית','עצר'],notes:[`רוחב כנף: ${fmt(lw)} מ״מ`,`מרווח בין מוטות: ${fmt(top.sp)} מ״מ`]}}},
 RL:{name:'מעקה',wl:'אורך מעקה',W:[1000,6000,500],H:[1050],f(Len,H){
  const np=Math.ceil(Len/1500)+1,seg=(Len-np*50)/(np-1),postL=H-40,balL=H-40-90;
  let sh=[R(0,0,Len,40)],nb=0,sp=0;
  for(let i=0;i<np;i++){const x=i*(seg+50);sh.push(R(x,40,50,postL,OR));if(i<np-1){const b=vbars(x+50,seg,40,balL);nb+=b.n;sp=b.sp;sh.push(R(x+50,H-90,seg,20),...b.a)}}
  sh.push(Lh(-200,H,Len+200,H));
  return{L:Len,H,parts:[['מאחז יד','60×40×2',Len,1],['עמוד','50×50×2',postL,np],['קורה תחתונה','40×20×2',seg,np-1],['שבכה (מוט)','20×20×1.5',balL,nb]],
   shapes:sh,dims:[D(0,-Len*.05,Len,-Len*.05,fmt(Len)),D(-Len*.05,0,-Len*.05,H,fmt(H))],
   hw:[`${np} פלטות בסיס 120×120×8 + 4 ברגי עיגון לכל עמוד`],
   notes:[`${np} עמודים במרחק ${fmt(seg+50)} מ״מ`,`מרווח בין מוטות: ${fmt(sp)} מ״מ`,'מרווח מהרצפה לקורה התחתונה: 70 מ״מ','גובה, מרווחים ועומסים – לאמת מול ת״י 1142 לפני ביצוע']}}},
 GR:{name:'סורג חלון',wl:'רוחב',W:[600,2000,100],H:[600,1600,100],f(W,H){
  const f=25,inW=W-2*f,inH=H-2*f,b=vbars(f,inW,f,inH,16),nh=Math.max(1,Math.ceil(inH/600)-1);
  const hs=[];for(let i=1;i<=nh;i++)hs.push(R(f,f+inH*i/(nh+1)-15,inW,30,WH,'#B9C1CA'));
  return{L:W,H,parts:[['מסגרת אופקית','25×25×2',W,2],['מסגרת אנכית','25×25×2',inH,2],['מוט אנכי','16×16×1.5',inH,b.n],['פס אופקי (פלח)','30×5',inW,nh]],
   shapes:[R(0,0,W,f,OR),R(0,H-f,W,f,OR),R(0,f,f,inH,OR),R(W-f,f,f,inH,OR),...b.a,...hs],
   dims:[D(0,-H*.07,W,-H*.07,fmt(W)),D(-W*.07,0,-W*.07,H,fmt(H))],
   hw:['4–6 אוזני עיגון / ברגי טריז'],notes:[`מרווח בין מוטות: ${fmt(b.sp)} מ״מ`,'במידה של חלון יציאת חירום – להתקין סורג נפתח']}}},
 FN:{name:'גדר (מקטע)',wl:'אורך מקטע',W:[2000,2500,3000],H:[1000,1200,1400,1600,1800,2000],f(L,H){
  const inL=L-60,pickH=H-100,nr=H>1500?3:2,b=vbars(30,inL,0,pickH);
  const rails=[];for(let i=0;i<nr;i++)rails.push(R(30,150+(pickH-300)*i/(nr-1),inL,20,WH,'#B9C1CA'));
  return{L,H,parts:[['עמוד (כולל 400 ביסוס)','60×60×2',H+400,2],['קורת חיבור','40×20×1.5',inL,nr],['מוט גדר','20×20×1.5',pickH,b.n]],
   shapes:[R(-30,-40,60,H+440,OR),R(L-30,-40,60,H+440,OR),...b.a,...rails,Lh(-250,H,L+250,H),Lh(-60,H+400,L+60,H+400,ST,1)],
   dims:[D(0,-L*.05,L,-L*.05,fmt(L)+' (מרכז-מרכז)'),D(-L*.06,0,-L*.06,H,fmt(H))],
   hw:['בטון לביסוס עמודים (בור 300×300×400)'],notes:[`מרווח בין מוטות: ${fmt(b.sp)} מ״מ`,'מרווח מהקרקע: 100 מ״מ','בגדר רציפה – עמוד משותף בין מקטעים (להפחית עמוד אחד לכל מקטע נוסף)']}}},
 ST:{name:'מדרגות',wl:'רוחב מדרגות',hl:'גובה קומה',W:[800,1000,1200],H:[1000,3000,250],f(W,H){
  const n=Math.round(H/175),r=H/n,g=Math.min(300,Math.max(250,630-2*r)),nt=n-1,run=nt*g,sl=Math.round(Math.hypot(run+g,H)),inW=W-100;
  const sh=[Lh(-300,H,run+300,H),Lh(run,0,run+900,0)];
  for(let i=1;i<=nt;i++)sh.push(R((i-1)*g,H-i*r,g,30));
  sh.push(Lh(0,H,run,0,WH),Lh(180,H,run+180,0,WH));
  return{L:run,H,parts:[['קורת צד (מיתר)','100×50×3',sl,2],['מסגרת שלח – חזית/גב','40×20×2',inW,nt*2],['מסגרת שלח – צד','40×20×2',g-40,nt*2],['זווית תמיכה לשלח','40×40×4',g,nt*2]],
   shapes:sh,dims:[D(0,H+H*.08,run,H+H*.08,fmt(run)),D(-H*.08,0,-H*.08,H,fmt(H))],
   hw:['פלטות עיגון לרצפה ולתקרה העליונה','משטחי דריכה (עץ / פח מרוג) – לא כלולים'],
   notes:[`${n} רומים של ${fmt(r)} מ״מ, שלח ${fmt(g)} מ״מ (2R+G = ${fmt(2*r+g)})`,`רוחב נטו בין המיתרים: ${fmt(inW)} מ״מ`,'נדרש מעקה / מאחז יד – לפי תקנות התכנון והבנייה ות״י 1142']}}},
 PG:{name:'פרגולה',wl:'אורך',hl:'עומק',W:[3000,6000,500],H:[2500,3000,3500,4000],f(L,Dp){
  const Hh=2500,np=L>4000?3:2,nr=Math.ceil((L+300)/450)+1,sp=(L+300)/(nr-1);
  const sh=[R(-150,0,L+300,120),Lh(-400,Hh,L+400,Hh)];
  for(let i=0;i<np;i++)sh.push(R(i*(L-100)/(np-1),120,100,Hh-120,OR));
  for(let i=0;i<nr;i++)sh.push(R(-150+i*sp-20,-80,40,80));
  return{L,H:Hh,parts:[['עמוד','100×100×3',Hh-120,np*2],['קורה ראשית','120×60×3',L+300,2],['קורת רוחב (רפטר)','80×40×2',Dp+300,nr]],
   shapes:sh,dims:[D(0,-L*.08,L,-L*.08,fmt(L)),D(-L*.09,0,-L*.09,Hh,fmt(Hh))],
   hw:[`${np*2} פלטות בסיס 200×200×10 + 4 ברגי עיגון לכל עמוד`],
   notes:[`עומק ${fmt(Dp)} מ״מ, בליטה 150 מ״מ מכל צד`,`${nr} קורות רוחב במרווח ${fmt(sp)} מ״מ`,'פרגולה עם כיסוי (פוליקרבונט / פאנל) – נדרשת בדיקת מהנדס לעומסי רוח']}}},

<script>
function kgm(p){const v=p.split('×').map(Number);const a=v.length===3?2*(v[0]+v[1])*v[2]-4*v[2]*v[2]:v[0]*v[1];return a*7.85/1000}
function pack(parts){
 const by={},joins=new Set();
 for(const [n,p,len,q] of parts)for(let i=0;i<q;i++){
  if(len>STOCK){const k=Math.ceil(len/(STOCK-KERF));joins.add(n);for(let j=0;j<k;j++)(by[p]??=[]).push(len/k)}
  else (by[p]??=[]).push(len)}
 const rows=Object.entries(by).map(([p,arr])=>{arr.sort((a,b)=>b-a);const bins=[];
  for(const l of arr){const i=bins.findIndex(r=>r>=l+KERF);if(i>=0)bins[i]-=l+KERF;else bins.push(STOCK-l-KERF)}
  const used=arr.reduce((a,b)=>a+b,0);return{p,bars:bins.length,m:used/1000,waste:1-used/(bins.length*STOCK),kg:used/1000*kgm(p)}});
 return{rows,joins:[...joins]};
}
const sz=x=>{const g=GEN[x.k];return `${g.wl} ${fmt(x.W)} · ${g.hl||'גובה'} ${fmt(x.H)}`};
const plan=id=>{const x=PLANS.find(p=>p.id===id);if(!x)return null;const g=GEN[x.k];return{...x,name:g.name,...g.f(x.W,x.H)}};
const st={k:'SG',w:'',h:'',shown:24,sel:null};
const $=id=>document.getElementById(id);
$('total').textContent=`${PLANS.length} תוכניות ב-${Object.keys(GEN).length} סוגי עבודה. בחרו סוג ומידה – כל תוכנית כוללת שרטוט, רשימת חיתוך, כמות פרופילים ופרזול.`;
$('types').innerHTML=Object.entries(GEN).map(([k,g])=>`<button data-k="${k}">${g.name} <span class="muted">(${PLANS.filter(p=>p.k===k).length})</span></button>`).join('');
$('types').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.k=b.dataset.k;st.w=st.h='';st.shown=24;fillSel();render()};
function fillSel(){
 const ps=PLANS.filter(p=>p.k===st.k),g=GEN[st.k];
 const opt=(arr,v)=>`<option value="">הכול</option>`+[...new Set(arr)].map(x=>`<option value="${x}" ${x==v?'selected':''}>${fmt(x)} מ״מ</option>`).join('');
 $('fw').previousElementSibling.textContent=g.wl;$('fw').innerHTML=opt(ps.map(p=>p.W),st.w);$('fh').previousElementSibling.textContent=g.hl||'גובה';$('fh').innerHTML=opt(ps.map(p=>p.H),st.h);
 [...$('types').children].forEach(b=>b.classList.toggle('on',b.dataset.k===st.k));
}
$('fw').onchange=e=>{st.w=e.target.value;st.shown=24;render()};
$('fh').onchange=e=>{st.h=e.target.value;st.shown=24;render()};
$('more').onclick=()=>{st.shown+=24;render()};
function render(){
 const ps=PLANS.filter(p=>p.k===st.k&&(!st.w||p.W==st.w)&&(!st.h||p.H==st.h));
 $('count').textContent=`${ps.length} תוכניות`;
 $('list').innerHTML=ps.slice(0,st.shown).map(x=>{const p=plan(x.id);
  return`<button class="item ${st.sel===x.id?'sel':''}" data-id="${x.id}">${draw(p.L,p.H,p.shapes,[],1)}<b>${p.name}</b><span style="display:block">${sz(x)}</span><span class="code" dir="ltr">${x.id}</span></button>`}).join('');
 $('more').style.display=ps.length>st.shown?'block':'none';
}
$('list').onclick=e=>{const b=e.target.closest('.item');if(b)location.hash=b.dataset.id};
function show(id){
 const p=plan(id);if(!p){$('detail').innerHTML='';document.body.style.overflow='';return}
 if(p.k!==st.k){st.k=p.k;st.w=st.h='';fillSel()}st.sel=id;render();
 const {rows,joins}=pack(p.parts),bars=rows.reduce((a,r)=>a+r.bars,0),kg=rows.reduce((a,r)=>a+r.kg,0);
 $('detail').innerHTML=`<div class="card" style="margin-top:8px"><button class="close no-print" id="x" aria-label="סגירה">✕</button>
 <h2>${p.name}</h2><p style="font-size:18px;font-weight:700;margin-bottom:6px">${sz(PLANS.find(z=>z.id===id))} (מ״מ)</p>
 <div class="meta"><span>קוד: <b class="code" dir="ltr">${id}</b></span><span>מידות כוללות: ${ltr(fmt(p.L)+' × '+fmt(p.H))}</span><span>פרופילים לקנייה: <b>${bars}</b></span><span>משקל פלדה משוער: <b>${fmt(kg)} ק״ג</b></span></div>
 ${draw(p.L,p.H,p.shapes,p.dims)}
 <h2>רשימת חיתוך</h2><div class="tbl"><table><tr><th>#</th><th>חלק</th><th>פרופיל</th><th>אורך (מ״מ)</th><th>כמות</th></tr>
 ${p.parts.map(([n,pr,l,q],i)=>`<tr><td>${i+1}</td><td>${n}</td><td>${ltr(pr)}</td><td>${fmt(l)}</td><td>${q}</td></tr>`).join('')}</table></div>
 <h2>קנייה – פרופילים של 6 מ׳</h2><div class="tbl"><table><tr><th>פרופיל</th><th>יחידות 6 מ׳</th><th>מטר נטו</th><th>פחת</th></tr>
 ${rows.map(r=>`<tr><td>${ltr(r.p)}</td><td><b>${r.bars}</b></td><td>${r.m.toFixed(1)}</td><td>${Math.round(r.waste*100)}%</td></tr>`).join('')}</table></div>
 <p class="muted" style="font-size:14px;margin-top:6px">חישוב לפי חיתוך אופטימלי עם ${KERF} מ״מ עובי מסור לכל חיתוך.</p>
 ${joins.length?`<div class="warn">⚠️ ארוך מ-6 מ׳ – נדרש חיבור/ריתוך המשך: ${joins.join(', ')}</div>`:''}
 <h2>פרזול ואביזרים</h2><ul style="padding-inline-start:20px">${p.hw.map(h=>`<li>${h}</li>`).join('')}</ul>
 <h2>הערות</h2><ul style="padding-inline-start:20px">${p.notes.map(h=>`<li>${h}</li>`).join('')}</ul>
 <div class="warn">תבנית עבודה בלבד. פרופילים, עיגון ועומסים – באחריות המבצע ולפי התקן ותנאי האתר.</div>
 <p class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" onclick="print()">הדפסה / שמירה כ-PDF</button><button class="btn ghost" id="cp">העתקת קישור</button></p></div>`;
 $('cp').onclick=()=>{navigator.clipboard?.writeText(location.href).then(()=>$('cp').textContent='הקישור הועתק ✓',()=>{})};
 $('x').onclick=closeD;$('detail').scrollTop=0;document.body.style.overflow='hidden';
}
function closeD(){history.pushState(null,"",location.pathname+location.search);show("")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD()});
$("detail").addEventListener("click",e=>{if(e.target.id==="detail")closeD()});
window.onhashchange=()=>show(decodeURIComponent(location.hash.slice(1)));
const q=new URLSearchParams(location.search).get('type');if(q&&GEN[q])st.k=q;
fillSel();render();if(location.hash)show(decodeURIComponent(location.hash.slice(1)));
