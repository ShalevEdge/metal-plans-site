<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>המשימה שלי | SHALVERO FORGE</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css">
<style>
.w-box{max-width:760px;margin:20px auto;background:var(--card);border:2px solid var(--or);border-radius:20px;padding:20px}
.w-box h1{margin:4px 0;font-size:clamp(28px,6vw,40px)}.w-meta{color:var(--steel);font-size:17px}
.w-big{display:grid;gap:12px;margin:18px 0}.w-big a,.w-big button{display:block;text-align:center;font:inherit;font-size:22px;font-weight:900;padding:18px;border-radius:14px;text-decoration:none;cursor:pointer;border:2px solid var(--line);background:var(--card2);color:var(--tx)}
.w-big .pri{background:#f97316;border-color:#f97316;color:#fff}.w-big .ok{background:#16a34a;border-color:#16a34a;color:#fff}
.w-chk{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}.w-chk label{display:flex!important;gap:12px;align-items:center;font-size:19px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.w-chk input{width:26px;height:26px;accent-color:#16a34a}.w-note{background:rgba(249,115,22,.12);border:1px solid var(--or);border-radius:12px;padding:12px;font-size:18px}
.w-list{display:flex;flex-direction:column;gap:8px}.w-list a{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx);text-decoration:none}
</style></head>
<body><div id="nav"></div><main class="wrap"><div class="w-box" id="app"></div></main>
<script src="app.js"></script>
<script>
try{nav.innerHTML=MP.nav('worker.html')}catch(e){}
(function(){
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec=s=>{try{s=s.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}};
const K='forge_worker_jobs_v1';const J=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}};const SV=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}};
const m=location.hash.match(/d=([^&]+)/);const d=m&&dec(m[1]);const jobs=J();
if(d&&d.id){const key=d.id+'|'+(d.due||'')+'|'+(d.w||'');if(!jobs[key])jobs[key]={d,chk:{},at:Date.now()};else jobs[key].d=d;SV(jobs);render(key)}else list();
function list(){const ks=Object.keys(jobs).sort((a,b)=>jobs[b].at-jobs[a].at);
 app.innerHTML=`<p class="tag">WORKER</p><h1>👷 המשימות שלי</h1><p class="w-meta">כאן מופיעות משימות שהבוס שלח לך בקישור. פותחים את הקישור מהוואטסאפ – והמשימה נשמרת כאן בטלפון.</p>`+
 (ks.length?`<div class="w-list">${ks.map(k=>{const j=jobs[k];return`<a href="#d=${location.hash?'':''}" data-k="${E(k)}"><b>${E(j.d.name)}</b><span>${j.done?'✓ הסתיים':E(j.d.due||'')}</span></a>`}).join('')}</div>`:'<p class="w-meta"><b>אין עדיין משימות.</b></p>');
 app.querySelectorAll('[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.k)})}
function render(key){const j=jobs[key],d=j.d,plan='plans.html#'+encodeURIComponent(d.id),ws='plans.html?ws=1#'+encodeURIComponent(d.id);
 const C=['קראתי את כל דף העבודה למסגר','בדקתי שהחומר שהגיע תואם לרשימת הקנייה','חתכתי לפי רשימת החיתוך וסימנתי מספרים','ריתכתי נקודות ובדקתי ריבוע (אלכסונים שווים)','ריתוך מלא + ניקוי והשחזה','צבע/גלוון לפי ההוראות','צילמתי את העבודה הגמורה'];
 const ph=v=>{v=String(v||'').replace(/\D/g,'');return v.startsWith('0')?'972'+v.slice(1):v};
 app.innerHTML=`<p class="tag">המשימה שלך${d.w?' · '+E(d.w):''}</p><h1>${E(d.name)}</h1><p class="w-meta">מידה: ${E(d.size)} · ${d.parts?E(d.parts)+' חלקים לחיתוך · ':''}${d.due?'יעד: <b>'+E(d.due.split('-').reverse().join('/'))+'</b>':''}${d.boss?' · מאת '+E(d.boss):''}</p>
 ${d.notes?`<div class="w-note">📌 ${E(d.notes)}</div>`:''}
 <div class="w-big"><a class="pri" href="${ws}">🛠️ מצב סדנה – צעד אחרי צעד</a><a href="${plan}">📐 השרטוט, רשימת חיתוך ודף עבודה</a></div>
 <h2>רשימת בדיקה</h2><ul class="w-chk">${C.map((c,i)=>`<li><label><input type="checkbox" data-i="${i}" ${j.chk[i]?'checked':''}>${c}</label></li>`).join('')}</ul>
 <div class="w-big"><button class="ok" id="fin">✅ סיימתי – לעדכן את הבוס</button><button id="all">כל המשימות שלי</button></div>`;
 app.querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{j.chk[c.dataset.i]=c.checked;SV(jobs)});
 fin.onclick=()=>{j.done=true;SV(jobs);const n=Object.values(j.chk).filter(Boolean).length;const t=`✅ סיימתי את ${d.name} (${d.size}). רשימת בדיקה: ${n}/${C.length}.${d.w?' – '+d.w:''}`;location.href='https://wa.me/'+ph(d.bp)+'?text='+encodeURIComponent(t)};
 all.onclick=()=>{history.replaceState(null,'',location.pathname);list()}}
})();
</script></body></html>
