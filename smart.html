<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עוזר חכם למסגר | תוכניות עבודה למסגרים</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#E8590C"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body><div id="nav"></div><main class="wrap"><p class="tag">SMART JOB ASSISTANT · BETA</p><h1>כתוב מה צריך</h1><p class="muted">העוזר המקומי מזהה סוג עבודה, מידות, חומר וסגנון ומכין טיוטה. החישובים עצמם נעשים במנוע התוכניות — לא על ידי טקסט חופשי.</p><div class="card"><label>תיאור העבודה<textarea id="text" rows="6" placeholder="לדוגמה: שער נגרר לפתח 4.2 מטר, גובה 1.6 מטר, מילוי אופקי, ברזל שחור"></textarea></label><div class="actions"><button class="btn" id="parse">בנה טיוטה</button><button class="btn ghost" id="example">הכנס דוגמה</button></div></div><div id="out" style="margin-top:14px"></div><div class="notice"><b>חשוב:</b> העוזר הזה לא מחליט על פרופיל קונסטרוקטיבי, עומסים, עיגון או התאמה לתקן. הוא רק מתרגם את הבקשה לשדות שהמנוע יודע לחשב.</div></main><script src="app.js"></script><script>nav.innerHTML=MP.nav('smart.html');const TYPES=[['SG','שער נגרר',['שער נגרר','הזזה','קונזולי']],['DG','שער כנף כפול',['שער כנף','דו כנפי','שתי כנפיים']],['PP','פשפש',['פשפש']],['FN','גדר',['גדר']],['RL','מעקה',['מעקה']],['GR','סורג חלון',['סורג']],['ST','מדרגות',['מדרגות']],['PG','פרגולה',['פרגולה']],['CP','סככת חניה',['קרפורט','סככת חניה']],['CN','גגון',['גגון']],['SK','סוכה',['סוכה']],['SH','מדפייה',['מדפייה','מדפים']]];const DEF={SG:[4000,1600,'v'],DG:[3500,1600,'v'],PP:[1000,2000,'v'],FN:[2500,1200,'v'],RL:[3000,1050,'v'],GR:[1200,1000,'v'],ST:[1000,2800,''],PG:[4000,3000,''],CP:[4000,5000,'f'],CN:[2500,1200,''],SK:[3000,3000,''],SH:[1200,2000,'']};function mm(n,u){n=+n;if(/מטר|מ'/.test(u))return Math.round(n*1000);if(/ס.?מ/.test(u)&&!/מ.?מ/.test(u))return Math.round(n*10);return Math.round(n)}function parseDim(t,word){const r=new RegExp(word+'[^0-9]{0,14}(\\d+(?:[.,]\\d+)?)\\s*(מטר|מ\'|מ״מ|ממ|ס״מ|סמ)?');const m=t.match(r);return m?mm(m[1].replace(',','.'),m[2]||'ממ'):null}function go(){const t=text.value.trim();if(!t){out.innerHTML='<div class="notice bad">כתוב תיאור עבודה.</div>';return}const low=t.toLowerCase(),hit=TYPES.find(x=>x[2].some(k=>low.includes(k))),type=hit?hit[0]:'SG',d=DEF[type];let w=parseDim(low,'(?:רוחב|פתח|אורך)'),h=parseDim(low,'(?:גובה|עומק)');const all=[...low.matchAll(/(\d+(?:[.,]\d+)?)\s*(מטר|מ'|מ״מ|ממ|ס״מ|סמ)/g)].map(m=>mm(m[1].replace(',','.'),m[2]));if(!w&&all[0])w=all[0];if(!h&&all[1])h=all[1];w=w||d[0];h=h||d[1];let s=d[2];if(/אופקי/.test(low))s='h';else if(/פח מלא|אטום/.test(low))s='s';else if(/רשת/.test(low))s='m';else if(/משבצ/.test(low))s='q';else if(/אנכי/.test(low))s='v';let m='fe';if(/מגולוון/.test(low))m='ga';else if(/אלומיניום/.test(low))m='al';else if(/נירוסטה/.test(low))m='ss';const name=hit?hit[1]:'שער נגרר';const url=`new-job.html?type=${type}&w=${w}&h=${h}&s=${s}&m=${m}`;out.innerHTML=`<div class="card"><h2>טיוטה שזוהתה</h2><div class="grid"><div><span class="muted">עבודה</span><h3>${name}</h3></div><div><span class="muted">מידות</span><h3>${w.toLocaleString()} × ${h.toLocaleString()} מ״מ</h3></div><div><span class="muted">חומר</span><h3>${({fe:'ברזל שחור',ga:'מגולוון',al:'אלומיניום',ss:'נירוסטה'})[m]}</h3></div><div><span class="muted">סגנון</span><h3>${s||'ללא'}</h3></div></div><div class="actions"><a class="btn" href="${url}">המשך לעבודה חדשה</a><a class="btn ghost" href="plans.html#${encodeURIComponent(`c:${type}:${w}:${h}:${s}`)}">נסה לפתוח תוכנית</a></div></div>`}parse.onclick=go;example.onclick=()=>{text.value='שער נגרר לפתח 4.2 מטר, גובה 1.6 מטר, מילוי אופקי, ברזל שחור';go()}</script></body></html>
