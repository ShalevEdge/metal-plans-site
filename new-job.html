<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עבודה חדשה | SHALVERO FORGE</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head><body><div id="nav"></div><main class="wrap"><p class="tag">NEW JOB</p><h1>עבודה חדשה</h1><p class="muted">פותחים עבודה פעם אחת וממשיכים ממנה לתוכנית, חיתוכים, הצעת מחיר ופרויקט.</p><div class="card" style="margin-top:20px"><div class="formgrid"><label>סוג עבודה<select id="type"></select></label><label>רוחב / אורך <span class="unit">מ״מ</span><input id="w" type="number" inputmode="numeric"></label><label>גובה / עומק <span class="unit">מ״מ</span><input id="h" type="number" inputmode="numeric"></label><label id="styleWrap">סגנון<select id="style"></select></label><label>חומר<select id="mat"><option value="fe">ברזל שחור</option><option value="ga">מגולוון</option><option value="al">אלומיניום</option><option value="ss">נירוסטה 304</option></select></label><label>שם לקוח<input id="cust" autocomplete="name"></label><label>טלפון<input id="phone" type="tel" autocomplete="tel"></label><label>תאריך יעד<input id="due" type="date"></label></div><label style="margin-top:12px">הערות<textarea id="notes" rows="3" placeholder="לדוגמה: מנוע חשמלי, צבע שחור, התקנה בקיר בלוקים"></textarea></label><div class="actions"><button class="btn" id="open">פתח תוכנית וחישוב</button><button class="btn ghost" id="save">שמור כטיוטת פרויקט</button><a class="btn ghost" href="optimizer.html">עבור לחיתוך</a></div><div id="msg" role="status"></div></div><div class="notice"><b>למה אין כאן מחיר “מהראש”?</b> המחיר הסופי מחושב אחרי שהמנוע בונה את רשימת החלקים בפועל. כך לא נותנים ללקוח מספר המבוסס רק על שטח או ניחוש.</div></main><script src="app.js"></script><script>nav.innerHTML=MP.nav('new-job.html');const TYPES={SG:{n:'שער נגרר',w:4000,h:1600,s:['v','h','s','m']},DG:{n:'שער כנף כפול',w:3500,h:1600,s:['v','h','s','m']},PP:{n:'פשפש',w:1000,h:2000,s:['v','h','s','m']},FN:{n:'גדר (מקטע)',w:2500,h:1200,s:['v','h','s','m']},RL:{n:'מעקה',w:3000,h:1050,s:['v','s','m']},GR:{n:'סורג חלון',w:1200,h:1000,s:['v','q']},ST:{n:'מדרגות',w:1000,h:2800,s:[]},PG:{n:'פרגולה',w:4000,h:3000,s:[]},CP:{n:'סככת חניה',w:4000,h:5000,s:['f','p']},CN:{n:'גגון קיר',w:2500,h:1200,s:[]},SK:{n:'סוכה (שלד)',w:3000,h:3000,s:[]},SH:{n:'מדפייה',w:1200,h:2000,s:[]}};const SN={v:'מוטות אנכיים',h:'מילוי אופקי',s:'פח מלא',m:'רשת מרותכת',q:'משבצות',f:'פנל מבודד',p:'פוליקרבונט'};type.innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');const qs=new URLSearchParams(location.search);function sync(){const t=TYPES[type.value];if(!t)return;styleWrap.style.display=t.s.length?'':'none';style.innerHTML=t.s.map(x=>`<option value="${x}">${SN[x]||x}</option>`).join('');if(!w.value)w.value=t.w;if(!h.value)h.value=t.h}type.onchange=()=>{w.value='';h.value='';sync()};const qtype=qs.get('type');if(qtype&&TYPES[qtype])type.value=qtype;sync();if(qs.get('w'))w.value=qs.get('w');if(qs.get('h'))h.value=qs.get('h');if(qs.get('s')&&[...style.options].some(o=>o.value===qs.get('s')))style.value=qs.get('s');if(qs.get('m'))mat.value=qs.get('m');const S=MP.settings();mat.value=qs.get('m')||S.mat||'fe';function id(){return`c:${type.value}:${Math.round(+w.value)}:${Math.round(+h.value)}:${styleWrap.style.display==='none'?'':style.value}`}function valid(){if(!(w.value>0&&h.value>0)){msg.innerHTML='<div class="notice bad">יש להזין שתי מידות תקינות.</div>';return false}return true}open.onclick=()=>{if(!valid())return;S.mat=mat.value;MP.saveSettings(S);location.href='plans.html#'+encodeURIComponent(id())};save.onclick=()=>{if(!valid())return;const P=MP.projects(),t=TYPES[type.value],d=new Date().toISOString().slice(0,10);P.unshift({id:id(),name:t.n,size:`${Math.round(+w.value)} × ${Math.round(+h.value)} מ״מ`,cust:cust.value.trim(),phone:phone.value.trim(),status:'הצעת מחיר',date:d,due:due.value,price:'',dep:'',notes:notes.value.trim(),material:mat.value});MP.saveProjects(P);msg.innerHTML='<div class="notice ok">הטיוטה נשמרה בפרויקטים ✓</div>'}</script></body></html>
