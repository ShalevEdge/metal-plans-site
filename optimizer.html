<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אופטימייזר חיתוך | SHALVERO FORGE</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#080B0F"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head><body><div id="nav"></div><main class="wrap"><p class="tag">CUT OPTIMIZER</p><h1>חיתוך אופטימלי למוטות</h1><p class="muted">מכניסים אורכים וכמויות. המערכת משתמשת קודם בשאריות מתאימות ואז פותחת מוטות חדשים.</p><div id="incoming"></div><div class="card"><div class="formgrid"><label>פרופיל / תיאור<input id="profile" placeholder="למשל 40×40×2"></label><label>אורך מוט חדש (מ״מ)<input id="stock" type="number"></label><label>רוחב להב / קרף (מ״מ)<input id="kerf" type="number"></label><label>מינימום שארית לשמירה (מ״מ)<input id="keep" type="number" value="250"></label></div><h2>חלקים לחיתוך</h2><div class="tbl"><table><thead><tr><th>אורך (מ״מ)</th><th>כמות (יח׳)</th><th>הערה</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="btn ghost" id="add">+ שורה</button><button class="btn" id="run">חשב סידור חיתוך</button><button class="btn ghost" id="demo">דוגמה</button></div></div><div id="result" style="margin-top:16px"></div></main><script src="app.js"></script><script>nav.innerHTML=MP.nav('optimizer.html');const S=MP.settings();stock.value=S.stock||6000;kerf.value=S.kerf||3;let last=null;const pending=MP.get('mp_optimizer_input_v1',null);function loadPending(i=0){if(!pending?.groups?.length)return;const g=pending.groups[i];profile.value=g.profile||'';rows.innerHTML='';g.parts.forEach(x=>row(x.length,x.qty,x.note));incoming.innerHTML=`<div class="notice ok"><b>נטען מתוך ${MP.esc(pending.planName||'תוכנית')}.</b> ${pending.groups.length>1?'בחר קבוצת פרופיל (חתך במ״מ): <select id="pg">'+pending.groups.map((x,j)=>`<option value="${j}" ${j===i?'selected':''}>${MP.esc(x.profile)}</option>`).join('')+'</select>':''}</div>`;const pg=document.getElementById('pg');if(pg)pg.onchange=()=>loadPending(+pg.value)};function row(l='',q=1,n=''){const tr=document.createElement('tr');tr.innerHTML=`<td><input class="l" type="number" inputmode="numeric" aria-label="אורך חלק לחיתוך במילימטרים" value="${l}"></td><td><input class="q" type="number" min="1" aria-label="כמות חלקים" value="${q}"></td><td><input class="n" aria-label="הערה לחלק" value="${MP.esc(n)}"></td><td><button class="btn ghost small del" type="button">✕</button></td>`;tr.querySelector('.del').onclick=()=>tr.remove();rows.appendChild(tr)}add.onclick=()=>row();demo.onclick=()=>{rows.innerHTML='';profile.value='40×40×2';[[2400,2,'קורות'],[1600,4,'עמודים'],[920,8,'מילוי'],[420,6,'חיזוקים']].forEach(x=>row(...x))};if(pending?.groups?.length){loadPending(0);localStorage.removeItem('mp_optimizer_input_v1')}else{row();row()}function optimize(){const L=+stock.value,K=Math.max(0,+kerf.value||0),min=+keep.value||0;if(!(L>0)){result.innerHTML='<div class="notice bad">אורך מוט לא תקין.</div>';return}const cuts=[];for(const tr of rows.children){const l=+tr.querySelector('.l').value,q=Math.floor(+tr.querySelector('.q').value),n=tr.querySelector('.n').value.trim();if(l>0&&q>0)for(let i=0;i<q;i++)cuts.push({l,n})}if(!cuts.length){result.innerHTML='<div class="notice bad">אין חלקים לחישוב.</div>';return}if(cuts.some(x=>x.l>L)){result.innerHTML='<div class="notice bad">יש חלק ארוך יותר מהמוט החדש. יש לפצל או לבחור אורך מלאי גדול יותר.</div>';return}cuts.sort((a,b)=>b.l-a.l);const inv=MP.inventory().filter(x=>(!profile.value.trim()||!x.profile||x.profile===profile.value.trim())&&+x.length>0).map(x=>({source:'inventory',id:x.id,length:+x.length,remain:+x.length,cuts:[]}));const bins=[...inv];let newCount=0;for(const c of cuts){let best=null,bestNeed=Infinity;for(const b of bins){const need=c.l+(b.cuts.length?K:0);if(b.remain>=need&&b.remain-need<bestNeed){best=b;bestNeed=b.remain-need}}if(!best){best={source:'new',id:'new-'+(++newCount),length:L,remain:L,cuts:[]};bins.push(best)}const need=c.l+(best.cuts.length?K:0);best.remain-=need;best.cuts.push(c)}const used=bins.filter(b=>b.cuts.length),newBars=used.filter(b=>b.source==='new'),oldBars=used.filter(b=>b.source==='inventory'),totalCut=cuts.reduce((a,x)=>a+x.l,0),totalInput=used.reduce((a,b)=>a+b.length,0),kerfs=used.reduce((a,b)=>a+Math.max(0,b.cuts.length-1)*K,0),waste=used.reduce((a,b)=>a+b.remain,0),util=totalInput?100*(totalCut/totalInput):0;last={used,min,profile:profile.value.trim(),L};result.innerHTML=`<div class="grid"><div class="card"><div class="muted">מוטות חדשים</div><div class="stat">${newBars.length}</div></div><div class="card"><div class="muted">שאריות שנוצלו</div><div class="stat">${oldBars.length}</div></div><div class="card"><div class="muted">ניצולת חומר</div><div class="stat">${util.toFixed(1)}%</div></div><div class="card"><div class="muted">שארית כוללת</div><div class="stat">${Math.round(waste)} מ״מ</div></div></div><div class="card" style="margin-top:14px"><h2>מפת חיתוך</h2>${used.map((b,i)=>{const pct=Math.max(0,Math.min(100,100*b.remain/b.length));return`<div style="margin:14px 0"><b>${b.source==='new'?'מוט חדש':'שארית מהמלאי'} #${i+1}</b> · ${Math.round(b.length)} מ״מ → ${b.cuts.map(x=>`${Math.round(x.l).toLocaleString('en-US')} מ״מ${x.n?' ('+MP.esc(x.n)+')':''}`).join(' + ')} <span class="pill">נשאר ${Math.round(b.remain)} מ״מ</span><div class="bar"><i style="width:${100-pct}%"></i></div></div>`}).join('')}<p class="muted">קרף מחושב בין חיתוכים: ${K} מ״מ · סה״כ קרף: ${Math.round(kerfs)} מ״מ</p><div class="actions"><button class="btn" id="applyInv">עדכן מלאי ושמור שאריות</button><button class="btn ghost" id="printBtn">הדפס מפת חיתוך</button></div><div id="rmsg"></div></div>`;applyInv.onclick=applyInventory;printBtn.onclick=()=>print();if(pending?.projectUid){const pb=document.createElement('button');pb.className='btn ghost';pb.type='button';pb.textContent='עדכן פרויקט לשלב חיתוך';printBtn.parentElement.appendChild(pb);pb.onclick=()=>{const P=MP.projects(),x=P.find(v=>v.uid===pending.projectUid);if(!x)return;x.status='חיתוך';x.updatedAt=new Date().toISOString();MP.saveProjects(P);pb.textContent='הפרויקט עודכן ✓'}}}function applyInventory(){if(!last)return;let inv=MP.inventory();const touched=new Set(last.used.filter(b=>b.source==='inventory').map(b=>b.id));inv=inv.filter(x=>!touched.has(x.id));for(const b of last.used){if(b.remain>=last.min)inv.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),profile:last.profile,length:Math.round(b.remain),source:b.source==='new'?'חיתוך חדש':'שארית קיימת',date:new Date().toISOString().slice(0,10)})}MP.saveInventory(inv);rmsg.innerHTML='<div class="notice ok">המלאי עודכן לפי מפת החיתוך ✓</div>'}run.onclick=()=>{S.stock=+stock.value||6000;S.kerf=+kerf.value||3;MP.saveSettings(S);optimize()}</script></body></html>
