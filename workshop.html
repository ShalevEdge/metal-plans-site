<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המסגריה שלי | תוכניות עבודה למסגרים</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#E8590C"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head><body><div id="nav"></div><main class="wrap"><p class="tag">MY WORKSHOP</p><h1>המסגריה שלי</h1><p class="muted">הגדרות פעם אחת — והן משמשות את התמחור, ההצעות והחישובים בכל המערכת.</p><div class="card"><h2>פרטי העסק</h2><div class="formgrid"><label>שם העסק<input id="biz"></label><label>טלפון<input id="phone" type="tel"></label><label>תעריף עבודה לשעה (₪)<input id="rate" type="number"></label><label>רווח יעד (%)<input id="marg" type="number"></label><label>מע״מ (%)<input id="vat" type="number"></label><label>התקנה בסיסית (₪)<input id="install" type="number"></label><label>אורך מוט סטנדרטי (מ״מ)<input id="stock" type="number"></label><label>קרף מסור (מ״מ)<input id="kerf" type="number"></label><label>פחת יעד (%)<input id="waste" type="number"></label></div><h2>מחירי חומר ברירת מחדל (₪/ק״ג)</h2><div class="formgrid"><label>ברזל שחור<input id="fe" type="number" step="0.5"></label><label>מגולוון<input id="ga" type="number" step="0.5"></label><label>אלומיניום<input id="al" type="number" step="0.5"></label><label>נירוסטה 304<input id="ss" type="number" step="0.5"></label></div><h2>ספקים</h2><div id="sup"></div><div class="actions"><button class="btn ghost" id="addSup">+ ספק</button><button class="btn" id="save">שמור הגדרות</button></div><div id="msg"></div></div><div class="notice">המחירים נשמרים במכשיר ומשמשים כבר עכשיו את מנגנון הצעת המחיר הקיים ב־<a href="plans.html">ספריית התוכניות</a>. מומלץ לעדכן אותם לפי מחירון הספק בפועל.</div></main><script src="app.js"></script><script>nav.innerHTML=MP.nav('workshop.html');let S=MP.settings();biz.value=S.biz||'';phone.value=S.phone||'';rate.value=S.rate??180;marg.value=S.marg??25;vat.value=S.vat??18;install.value=S.install??0;stock.value=S.stock??6000;kerf.value=S.kerf??3;waste.value=S.waste??8;fe.value=S.ppk?.fe??9;ga.value=S.ppk?.ga??9;al.value=S.ppk?.al??38;ss.value=S.ppk?.ss??42;function supplier(v={name:'',phone:'',note:''}){const d=document.createElement('div');d.className='card';d.style.margin='8px 0';d.innerHTML=`<div class="formgrid"><label>שם ספק<input class="sn" value="${MP.esc(v.name)}"></label><label>טלפון<input class="sp" value="${MP.esc(v.phone)}"></label><label>הערה<input class="sx" value="${MP.esc(v.note)}"></label></div><button class="btn ghost small rm" type="button" style="margin-top:8px">הסר</button>`;d.querySelector('.rm').onclick=()=>d.remove();sup.appendChild(d)};(S.suppliers||[]).forEach(supplier);if(!sup.children.length)supplier();addSup.onclick=()=>supplier();save.onclick=()=>{S.biz=biz.value.trim();S.phone=phone.value.trim();S.rate=+rate.value||0;S.marg=+marg.value||0;S.vat=+vat.value||0;S.install=+install.value||0;S.stock=+stock.value||6000;S.kerf=+kerf.value||3;S.waste=+waste.value||0;S.ppk=Object.assign({},S.ppk,{fe:+fe.value||0,ga:+ga.value||0,al:+al.value||0,ss:+ss.value||0});S.suppliers=[...sup.children].map(d=>({name:d.querySelector('.sn').value.trim(),phone:d.querySelector('.sp').value.trim(),note:d.querySelector('.sx').value.trim()})).filter(x=>x.name||x.phone);MP.saveSettings(S);msg.innerHTML='<div class="notice ok">ההגדרות נשמרו ומשותפות לכל האתר ✓</div>'}</script></body></html>
